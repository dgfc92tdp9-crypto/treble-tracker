# Universe definition (spec §9.4; decision 0005).
#
# What the security master is populated *for*. Subsets are a configuration,
# never a code change — pointing this at a different universe is an edit
# here and a re-run of `treble populate`.
#
# Decision 0005 sets the Phase 1 default to every EDGAR XBRL filer. That is
# ~8k companies and hours of wall clock, so the file defines several named
# universes and the runner takes one by name: `dev` for iteration, `full`
# for the real thing. Both use the identical code path, so a green `dev`
# run is genuine evidence the `full` run will work.

universes:
  # Small, fast, and real — for development and for `treble init` seeding.
  # These CIKs are stable, high-profile filers with rich XBRL histories.
  dev:
    description: Ten large US filers; minutes to populate, exercises every adapter
    edgar_ciks:
      - 51143      # International Business Machines
      - 320193     # Apple
      - 789019     # Microsoft
      - 1018724    # Amazon
      - 200406     # Johnson & Johnson
      - 19617      # JPMorgan Chase
      - 34088      # Exxon Mobil
      - 104169     # Walmart
      - 80424      # Procter & Gamble
      - 93410      # Chevron
    # The full CMT tenor set: ICVS needs a curve, and two points is a line.
    # Index levels back GP/HP for the Index namespace. FRED is the only
    # free source whose terms permit automated access without defeating a
    # bot gate (Stooq) or breaching a ToS (Yahoo) — see PROGRESS.
    fred_series: [DGS1MO, DGS3MO, DGS6MO, DGS1, DGS2, DGS3, DGS5, DGS7, DGS10, DGS20, DGS30, SP500, NASDAQ100, NASDAQCOM, DJIA, VIXCLS, SOFR, T10Y2Y, BAMLC0A0CM]
    treasury_auctions_since: "2026-01-01"
    # Bulk XBRL: one 85 MB archive per quarter covers every filer, where the
    # per-CIK API needs a request each. This is what makes the full-universe
    # run tractable; companyfacts stays the route to deep history on a
    # single filer, so both are configured rather than one replacing the other.
    edgar_bulk_quarters: ["2026q1"]
    # N-PORT filings supply per-bond valuations — the only licence-clean
    # route to corporate bond prices, since TRACE is subscription-gated.
    # Named explicitly rather than discovered: the Phase 1 audit found this
    # adapter shipped, unit-tested, and never once run because no universe
    # invoked it, so the store held no corporate bonds at all.
    nport_filings:
      - [36405, "0000036405-26-000325"]
      - [216907, "0001099263-26-006559"]
      - [356494, "0000035402-26-003510"]

  # Decision 0005's target. Populated by discovering every filer from
  # EDGAR's bulk company index rather than an enumerated list — an
  # enumerated 8k-line list would go stale the day it was written.
  full:
    description: Every EDGAR XBRL filer (decision 0005); hours, tens of GB
    edgar_ciks: discover   # sentinel: resolve from EDGAR's company index
    fred_series: [DGS1MO, DGS3MO, DGS6MO, DGS1, DGS2, DGS3, DGS5, DGS7, DGS10, DGS20, DGS30, SP500, NASDAQ100, NASDAQCOM, DJIA, VIXCLS, SOFR, T10Y2Y, BAMLC0A0CM, BAMLH0A0HYM2, CPIAUCSL]
    treasury_auctions_since: "2020-01-01"
    nport_filings: []

# Per-source pacing. These are the published limits (CLAUDE.md §6), not
# guesses; the adapters enforce them with token buckets.
rate_limits:
  edgar_per_second: 10        # SEC published limit
  openfigi_per_minute: 25     # unauthenticated; 250 with a free API key
  gleif_per_second: 1
  treasury_per_second: 2

# OpenFIGI is the binding constraint at full scale: 25 mapping requests per
# minute unauthenticated, 100 jobs per request, so ~2,500 instruments/minute.
# Set OPENFIGI_API_KEY in .env to raise this tenfold. The runner batches to
# the maximum job size regardless.
openfigi:
  jobs_per_request: 100
