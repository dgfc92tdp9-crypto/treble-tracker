# The completion ledger — the single source of truth for the reported figure.
#
# The percentage was stated by hand and got it wrong twice in one update: the
# phase weight was reverse-engineered from an earlier (also wrong) figure
# instead of read, and partial work packages were credited by impression
# rather than by deliverable. Both are the same mistake — trusting a recalled
# number over the recorded one.
#
# So the number is no longer written by anyone. `scripts/completion.py`
# computes it from this file, and `tests/test_completion.py` fails the gate if
# PROGRESS.md disagrees with the computation. To change the reported figure you
# must change a `done:` value here and give it a `basis:` — a countable
# statement, not a feeling.

# Fixed phase weights (Jack, 2026-07-26). These are the model; do not re-derive
# them from any previously reported percentage.
weights:
  phase_1: 30
  phase_2: 25
  phase_3: 15
  phase_4: 20
  phase_5: 10

active_phase: phase_2

# Phase 1 has 16 work packages, WP0–WP15. `done` is a fraction in [0, 1].
# Every value other than 0 or 1 needs a `basis` stating what was counted.
phase_1:
  WP0:  {done: 1.0, name: "Toolchain + CI"}
  WP1:  {done: 1.0, name: "core — identifiers, provenance, bitemporal facts"}
  WP2:  {done: 1.0, name: "store — payloads, ingest log, DuckDB"}
  WP3:  {done: 1.0, name: "screen definition contract + conformance harness"}
  WP4:  {done: 1.0, name: "analytics foundations — QuantLib, registry, curves"}
  WP5:  {done: 1.0, name: "bonds analytics — yield, spreads, risk, OAS"}
  WP6:  {done: 1.0, name: "ingest adapters",
         basis: "EDGAR companyfacts/submissions, EDGAR bulk XBRL, FRED,
                 Treasury, TRACE-file, OpenFIGI, GLEIF, N-PORT all ship with
                 recorded-fixture tests. Counted complete: the adapter set
                 the phase requires exists, and later sources are additions
                 rather than gaps"}
  WP7:  {done: 1.0, name: "security master + entity graph"}
  WP8:  {done: 1.0, name: "TAPI",
         basis: "field dictionary, in-process and HTTP transports, Python
                 client, the analytics service path, and the tql service
                 (which SRCH, EQS and the spreadsheet =TQL() all consume)
                 ship. gRPC and Arrow Flight belong to the server deployment
                 path and are Phase 2 by spec 8.3, so they are out of Phase 1
                 scope rather than missing from it"}
  WP9:  {done: 1.0, name: "TQL — grammar, planner, executor",
         basis: "grammar, planner, executor and analytics dispatch ship; the
                 spec 4.2 query runs, overrides reach the models, and SRCH
                 and EQS are screens whose panes are TQL queries. Named
                 universes remain unsupported and say so — they need index
                 membership data no free source provides"}
  WP10: {done: 1.0, name: "command grammar + dispatcher"}
  WP11: {done: 1.0, name: "screens",
         basis: "all 11 screens built (DES, EQS, FA, FLDS, GP, HP, ICVS, MDL,
                 SPTR, SRCH, YAS), each with a conformance case referencing
                 the shipped definition and rendering on both surfaces"}
  WP12: {done: 1.0, name: "renderers — TUI and desktop against one suite"}
  WP13: {done: 1.0, name: "spreadsheet add-in",
         basis: "TDP, TDH, TDS and TQL ship as plain functions over TAPI with
                 an xlwings shell; Excel is installed on the dev machine so
                 the open question about targeting LibreOffice is closed.
                 `treble addin` prints the install steps"}
  WP14: {done: 1.0, name: "local-only mode — treble init",
         basis: "`treble init` takes a clean checkout to a workstation with
                 real figures on it, verified with networking blocked: seven
                 screens render offline from recorded SEC and Treasury
                 payloads run through the real adapters"}
  WP15: {done: 1.0, name: "Phase 1 gate audit",
         basis: "every criterion audited by running it; one gap found and
                 fixed (I7 had no test protecting its own config); clean
                 checkout green at 88.38%; CI green on commit 13a87b4"}

# Phase 2 — real-time, portfolio, risk. One entry per CLAUDE.md §8 criterion,
# because the criteria *are* the deliverables here: unlike Phase 1 there is no
# separate work-package plan to track against, and inventing one would put a
# second set of numbers beside the gate's own.
phase_2:
  P2_1:  {done: 0.45, name: "ticker plant — conflated display, unconflated TPIPE",
          basis: "the conflation split, current-state cache, sequence-gap
                  detection and bounded TPIPE buffer ship and are
                  mutation-verified. TGN and TCMP composites now ship too
                  (treble/plant/quotes.py): TCMP over executable quotes
                  only, TGN over every live quote, as separate properties
                  because a composite blending indicative levels into a
                  price labelled executable is the most dangerous number a
                  quote screen can show. Counted here rather than under
                  P2_2, whose 0.95 rests on the ALLQ screen and the
                  contribution API — the composites were listed as
                  outstanding on this criterion and are credited once.
                  Outstanding: venue adapters, security master enrichment,
                  and the Redpanda and NATS transports"}
  P2_2:  {done: 1.0, name: "ALLQ correct-when-empty; contribution API",
          basis: "both halves ship. Correct-when-empty: expired quotes leave
                  the book empty rather than stale, it records when it last
                  held a live quote, a one-way market has no spread, and the
                  ALLQ screen renders the empty case with a contributor count
                  and a last-live stamp so 'nobody is quoting' and 'the screen
                  broke' cannot look the same — with a conformance case for
                  the empty state and one for a quoted state. Contribution
                  API: a validating service plus POST /contribute, which
                  refuses anonymous, one-sided, crossed, non-positive,
                  zero-size and future-dated quotes with the reason in a 400,
                  and echoes the composites so a contributor can see their
                  level reached the network. Quotes carry firmness
                  (indicative/executable, required with no default) and size;
                  TGN and TCMP are separate composites because a composite
                  blending indicative levels into an executable price is the
                  most dangerous number on the screen. Outstanding, and why
                  this is not counted lower: the HTTP server binds 127.0.0.1 only
                  and deliberately so — there is no authentication, and
                  exposing it needs §22.1's entitlement model (passkeys,
                  per-user entitlements, OIDC, audit logging), which no
                  phase before Phase 5 federation requires. So a remote
                  participant cannot contribute, and the reason is the
                  missing entitlement model rather than the transport. The
                  gRPC contribution surface now ships as well (P2_8), so
                  the criterion's two named halves — correct-when-empty and
                  a complete contribution API — are both done over every
                  transport this phase defines. Counted 1.0 on that basis:
                  the remaining limitation is the loopback binding, and that
                  is §22.1, which no phase before Phase 5 federation
                  requires. Out of scope rather than missing.
                  Corrected 2026-08-03: an earlier
                  version of this basis said the service was 'in-process',
                  which was wrong — POST /contribute is a real network
                  endpoint, just not a routable one"}
  P2_3:  {done: 0.0, name: "PORT with TFM3 v1; factor model validation",
          basis: "zero, and hard-blocked on data rather than effort —
                  measured 2026-08-03 rather than assumed. TFM3 is 1,500+
                  factors recalculated daily (§16.2) and its mathematics
                  (§16.3) needs a K x K factor covariance estimated from a
                  return panel. The store has no per-name equity price
                  history at all: PX_LAST covers 36 FRED series (index
                  levels, not constituents), 3 crypto and 3 FX pairs.
                  N-PORT implied marks give 1,861 names across *three*
                  report dates — two return observations per name, which
                  cannot estimate a covariance matrix at any number of
                  factors. No modelling recovers a panel that does not
                  exist, so this is not a partial. Unblocking it needs a
                  daily per-name equity price source; the one free candidate
                  identified so far is a Tiingo registration. Recorded here
                  so that the Phase 2 gate cannot be approached without
                  someone deciding that question first"}
  P2_4:  {done: 0.5, name: "TVAL v1 with transparency drill-down",
          basis: "the criterion's two named requirements ship. Score: 1-10
                  from four published components — corroboration, timeliness,
                  firmness, agreement — each exposed rather than rolled into
                  one number, plus the ASC 820 level with a documented and
                  tunable score-to-level mapping. Drill-down: every
                  observation comes back with its kind, recency and size
                  weights and its share of the price, and a test asserts the
                  headline price is reproducible from those rows. The
                  weighting function is a parameter with a content hash
                  stamped into the I3 envelope, because §15.3 requires a user
                  to be able to run the same machinery with their own weights
                  — baked-in weights would make independent price
                  verification impossible by construction. Refuses rather
                  than guesses: no observations, only-stale observations,
                  future-dated observations, and a weighting that values
                  nothing. Outstanding, and why this is 0.5 rather than
                  higher: (a) Prong 2 — the relative value algorithm that
                  prices a bond from comparables when it has no activity of
                  its own — is not built, and it is half the methodology;
                  it needs an issuer curve fitted across the issuer's
                  outstanding debt and a similarity metric over sector,
                  rating and seniority. (b) no TVAL screen. (c) §15.4's ML
                  residual layer and §15.5's multi-time bid/mid/ask
                  snapshots are untouched"}
  P2_5:  {done: 0.8, name: "CDSW against ISDA published test cases",
          basis: "the criterion is met: validated against ISDA's own
                  published RFR test grid (USD/SOFR, trade date 2022-06-22,
                  from cdsmodel.com under the ISDA CDS Standard Model Public
                  Licence v1.0, which permits reproduction and derivative
                  works with attribution retained). 2,388 published cases,
                  hazard calibrated so our par spread equals ISDA's quoted
                  spread and then priced at the trade's own coupon — the
                  ISDA workflow, so this tests conventions rather than a
                  curve fit. Result: median error 0.33bp of notional, worst
                  1.42bp, unbiased in sign. Getting there required the model
                  to accept a bootstrapped discount curve rather than a flat
                  rate; the flat-rate version left a 0.49bp median and a
                  4.68bp worst. Outstanding, and why this is not 1.0: the
                  residual is measured and attributed rather than removed —
                  it grows monotonically with maturity (0.11bp at 1y to
                  0.52bp at 10y) and with spread, which is the signature of
                  the per-period midpoint approximations for accrued-on-
                  default and protection discounting. Removing it needs real
                  IMM payment schedules and a finer protection integral. A
                  test asserts the attribution rather than leaving the
                  tolerance as a hiding place. Only the USD/SOFR grid is
                  wired; ISDA publishes EUR, GBP, JPY, CHF, AUD and the
                  older IBOR grids too"}
  P2_6:  {done: 0.85, name: "SWPM multi-curve CSA-aware discounting",
          basis: "the criterion's named requirement — multi-curve CSA-aware
                  discounting — ships and is validated. A forecast curve is
                  bootstrapped against an exogenous discount curve (never
                  itself), tenor basis curves connect index tenors, a
                  cross-currency-basis CSA discount curve is built off the
                  overnight curve, and the CSA resolves to a named discount
                  curve or refuses. The vanilla swap prices with PV, par
                  rate, annuity, cash flows, amortising notionals, and DV01
                  and bucketed DV01 computed by rebuilding the curves from
                  bumped market quotes. Validation: a trade written to match
                  a curve input reprices to its quote to under 0.01bp
                  through a code path independent of the bootstrap residual,
                  and 6/6 targeted mutations of the pricer are killed.
                  The market data exists and the whole chain is verified on
                  it: the DTCC SDR adapter builds four curves from CFTC Part
                  43 public dissemination — USD-SOFR-OIS and EUR-ESTR-OIS
                  for discounting, EUR-EURIBOR-6M and -3M for forecasting —
                  15 trading days each in the store, 14/14 mutations killed.
                  ESTR discounting against EURIBOR-6M forecasting is a real
                  multi-curve environment on real prints: a trade matching a
                  curve input reprices to its quote at 0.0000bp, and the
                  single-curve telescoping identity is broken by EUR 2.11m
                  on EUR 100m. Outstanding, and why this is not 1.0: (a) the
                  SWPM *screen* is still not built — the engine and its data
                  are done, the presentation is not; (b) spec §12.1 lists a
                  product set this does not yet cover: OIS legs (daily
                  compounding), cross-currency with notional exchange and
                  MtM resets, inflation, swaptions/caps/floors, CMS, asset
                  swaps, cancellable and extendible, total return.
                  The SWPM *screen* now ships: three tabs (valuation, curve
                  environment, cash flow schedule) rendering on both
                  surfaces from one definition, with conformance cases per
                  tab. It shows a spot-starting 10Y par swap against the
                  live ESTR/EURIBOR-6M pair — PV, par rate, annuity, DV01,
                  30 cash flows, and the basis per tenor. Counted 0.85
                  rather than 1.0 because the trade is a template rather
                  than a bookable position, and because the §12.1 product
                  set above is genuinely part of what SWPM means"}
  P2_7:  {done: 0.9, name: "Canvas with FDC3 context propagation",
          basis: "the criterion's named semantic ships and is
                  mutation-verified 6/6. Colour-group context propagation
                  (§5.3): a broadcast reaches every component on the
                  sender's channel and no other — not another colour, not an
                  unlinked component, and not the sender itself, per FDC3.
                  Joining a channel syncs immediately, because a component
                  that joined red and kept its previous instrument would
                  look linked and be stale, which on screen is
                  indistinguishable from being in sync. Leaving keeps the
                  last context and stops tracking. FDC3 interop is the
                  standard's own `fdc3.instrument`, so a third-party
                  application can broadcast one; since FDC3 carries no asset
                  class, the assumed yellow key is a named parameter rather
                  than a buried constant. One mutation found a latent bug
                  rather than a weak test: without the unlinked-sender
                  check, two unlinked components form an implicit shared
                  group and overwrite each other. Outstanding, and why this
                  is 0.7: the layout model and per-user persistence now
                  ship — placement in grid cells rather than pixels, because
                  a layout saved in pixels only reconstructs on the display
                  it was saved from and §5.3 says layouts follow a user
                  across machines; overlap reported rather than prevented,
                  since §4.2 allows floating windows over one another; and
                  restoring onto fewer displays refused rather than silently
                  reflowed, because reflowing loses an arrangement the user
                  built and is the renderer's offer to make with the user
                  watching. Context is deliberately NOT saved with a layout:
                  reopening a workspace and finding yesterday's instrument
                  on every screen, with nothing saying it is a day old, is
                  the stale-display failure refused everywhere else. The TUI
                  question is answered rather than left open — context
                  propagation is renderer-agnostic so a TUI pane joins a
                  colour group like any other component and I6 holds, while
                  free-form placement is not, so `placement` is optional and
                  a component without one is fully functional. `resolve_canvas`
                  now wires the bus to the renderers: every component
                  resolves through the same `resolve()` the screens use, at
                  one `as_of` for the whole workspace — resolving each
                  against its own clock would let two linked screens show
                  one instrument as of different moments, which reads as a
                  data disagreement rather than a timing artefact. An
                  unknown screen mnemonic raises rather than yielding an
                  empty pane, because a blank rectangle on a canvas is
                  indistinguishable from a component whose instrument has
                  nothing to report. Verified to fail when the context
                  hand-off is broken. `CNVS <GO>` now serves a whole
                  workspace: every component with its buffer, placement and
                  colour group, resolved at one as_of through the same
                  resolver the single-screen path uses. The single-screen
                  `buffer` field stays empty for a canvas, because a client
                  falling back to it would show one screen where a workspace
                  was asked for. Three states that would each render as an
                  empty rectangle are distinguished in the status line — no
                  canvas configured, a configured canvas with no components,
                  and a component that failed to resolve — since an empty
                  workspace and a lost layout look identical otherwise.
                  Disabling the CNVS branch fails 6 of 10 tests. Outstanding,
                  and why this is not 1.0: no *client* draws it. The server
                  returns the workspace; the Tauri shell and the TUI both
                  still render a single buffer, so multi-component layout is
                  unimplemented on both surfaces"}
  P2_8:  {done: 0.8, name: "gRPC + Arrow Flight transports",
          basis: "Arrow Flight ships: a FlightServerBase serving guarded
                  fact exports as Arrow tables with a fixed schema, reading
                  through the same store handle and the same point-in-time
                  as_of as every other TAPI path. Built on a bulk-export
                  guard that did not previously exist —
                  SourceMeta.redistribution_restricted had been declared on
                  13 adapters since Phase 1 and read by nothing, its own
                  docstring naming a guard that was never built. Now
                  restricted-source facts are withheld and counted (3,164
                  DTCC facts on the live store), licensed identifier
                  namespaces are refused outright per §9.3, and the
                  withholding travels in the table's schema metadata so a
                  warehouse can tell whether its copy is complete. 5/5
                  mutations of the guard killed. gRPC now ships too: five
                  services (refdata, flds, instruments, contrib, tql) over
                  the same LocalTapi the HTTP and Flight transports use, so
                  a client choosing gRPC gets the same answer to the same
                  question. Generated from proto/tapi.proto by `make proto`,
                  which `make check` depends on; the stubs are gitignored
                  and never committed, because a committed stub can silently
                  diverge from the proto beside it. A kill-test asserts the
                  generated services and RPCs match the proto's declarations
                  — verified to fail on a renamed service. as_of is required
                  and must be timezone-aware on the wire (I2), and
                  FIRMNESS_UNSPECIFIED is rejected rather than defaulted.
                  Outstanding, and why this is not 1.0: spec §8.3 also lists
                  mktdata, mktbar, mktvwap, ems and docs, and names streaming
                  subscriptions — all of which need the ticker plant's venue
                  adapters, which do not exist. Those services are absent
                  rather than stubbed, because an RPC that accepts a request
                  and returns nothing useful is worse than one a client can
                  see is missing"}
