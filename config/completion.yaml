# Phase 2 — real-time, portfolio, risk. One entry per CLAUDE.md §8 criterion,
# because the criteria *are* the deliverables here: unlike Phase 1 there is no
# separate work-package plan to track against, and inventing one would put a
# second set of numbers beside the gate's own.
phase_2:
  P2_1:  {done: 1.0, name: "ticker plant — conflated display, unconflated TPIPE",
          basis: "the conflation split, current-state cache, sequence-gap
                  detection and bounded TPIPE buffer ship and are
                  mutation-verified. TGN and TCMP composites now ship too
                  (treble/plant/quotes.py): TCMP over executable quotes
                  only, TGN over every live quote, as separate properties
                  because a composite blending indicative levels into a
                  price labelled executable is the most dangerous number a
                  quote screen can show. Counted here rather than under
                  P2_2, whose 0.95 rests on the ALLQ screen and the
                  contribution API — the composites were listed as
                  outstanding on this criterion and are credited once.
                  A real venue adapter now ships (treble/plant/venues.py),
                  which was recorded as blocked and was not. The note said
                  venue adapters need live trade feeds no free source
                  provides; that is true of equities and of every
                  consolidated tape, and false in general — crypto exchanges
                  publish their own matches over an unauthenticated
                  WebSocket, and this repository already read Coinbase for
                  daily candles. Coinbase's `matches` channel now feeds the
                  plant: 40 frames recorded live on 2026-08-06 back every
                  test, so CI never opens a socket and the parser is not
                  untested in the place that matters. The one choice that
                  inspection cannot check was measured rather than assumed:
                  Coinbase sends both `sequence` and `trade_id`, both
                  increasing integers, and `sequence` is the channel counter
                  — consecutive BTC-USD trades ran 133829171610, 133829172196,
                  133829172676, so feeding it would raise GapDetectedError on
                  every tick. `trade_id` is contiguous per product
                  (1067577991, 992, 993) and is what the plant needs. A test
                  publishes the recorded stream with the channel sequence and
                  asserts the gap detector fires, so the adapter rests on a
                  mechanism shown to work rather than on the parser having
                  looked right. Bar and VWAP aggregation ships on top of
                  it (treble/plant/bars.py): fixed-boundary OHLCV bars with
                  the unfinished interval marked partial, because a bar cut
                  at 'whenever the data stopped' reports a partial interval
                  as a whole one and the newest bar is the one a reader
                  trusts most. VWAP refuses rather than substituting — ticks
                  with no size give vwap=None instead of a simple average
                  wearing a volume-weighted name, which is precisely the
                  number a large print moves and a simple average does not.
                  Verified against the recorded feed, where Coinbase sizes
                  are ~1.3e-07 and prints share a timestamp to the
                  microsecond; every bar's VWAP lands inside its own high/low
                  range. Outstanding: this is one venue and crypto only — no
                  equity or bond venue is reachable this way and none is
                  claimed. Security master enrichment now ships for the
                  instruments the plant actually carries: CoinbaseProducts
                  Adapter stores name, tick size, base and quote currency,
                  minimum order value and — the reason it exists — trading
                  status. A delisted product keeps its price history, so
                  without a status an instrument the venue stopped trading
                  looks exactly like one it still trades, and the last print
                  reads as a current price rather than a final one.
                  `trading_disabled` is stored only when the venue states it,
                  because 'not disabled' and 'the venue did not say' are
                  different and only one means the instrument trades.
                  Increments are stored as numbers rather than the decimal
                  strings the API returns, since compared as text '0.1' sorts
                  below '0.01'. The subject comes from the document's own
                  `id`, not from the requested URL, so a redirect cannot
                  attach one instrument's reference data to another's
                  subject. 16 reference facts on the live store, and a
                  document with no recognised fields raises rather than
                  storing whatever still parsed. Extending the N-PORT
                  parser to read derivative holdings surfaced a data-
                  integrity defect that predates this work: filers write
                  cusip=N/A for holdings with none, holding_subject accepted
                  that literal string, and every unidentified holding in
                  every filing therefore keyed to one shared subject —
                  cusip:N/A held 2,110 facts across 26 fields and
                  cusip:000000000 another 932, each position overwriting the
                  last. The parser's own comment said such holdings were
                  skipped; the guard had never fired. Placeholder identifiers
                  are now refused, OTC derivatives are keyed by what actually
                  identifies them (counterparty, contract type, termination),
                  and the merged subjects were cleared and the payloads
                  replayed — no network, which is what I5 exists for. The
                  recovered data is real counterparty exposure: 16 contracts
                  across 12 counterparties, roughly USD 3.3bn notional, with
                  notional deliberately not stored under valUSD because a
                  swap's notional is its size and a screen summing the two
                  would report a book several times larger than it is.
                  The NATS JetStream transport now ships
                  (treble/plant/natsjs.py) behind a broker-agnostic seam
                  (treble/plant/transport.py), with an in-process
                  implementation of the same protocol for the local-only
                  install, and one conformance suite run against both — the
                  discipline render/ uses for renderers, because a transport
                  exercised only in-process has never had its wire format
                  tested and the symptom is a tick that arrives subtly wrong
                  rather than an exception. The NATS half runs against a real
                  nats-server subprocess (Apache-2.0, pinned v2.14.4, ~6MB,
                  fetched by `make tools`); a missing binary is an error, not
                  a skip, because a skipped transport test is a check that
                  cannot fail and this project has shipped two of those.
                  test_the_broker_is_real asserts the server greets with a
                  NATS INFO line, since every other test would also pass
                  against a fixture that quietly returned a fake. JetStream
                  carries the durable-log role too, so replay() rebuilds a
                  tape published before any subscriber existed (I5 for the
                  live path) and a replayed tape still trips the plant's own
                  gap detector, which is what carrying `sequence` over the
                  wire is for. Four defects were found by writing it rather
                  than by review: subscribe() was an async generator, so
                  nothing registered with the broker until the first read and
                  a publish in between was accepted, retained and never
                  delivered — both implementations hung, and subscription is
                  now an awaited fact; connect() caught Exception around
                  add_stream and so translated JetStream's real 'subjects
                  overlap with an existing stream' into a misleading 'stream
                  not found'; a test caught Exception around plant.publish
                  and turned a misspelled method name into a plausible error
                  string it then asserted on; and the end-to-end dotted-id
                  test claimed to guard the subject escaping and does not —
                  removing the escaping leaves it passing, because publish
                  and subscribe build the same exact subject and the
                  all-instruments pattern is ticks.>, which matches any
                  depth. That claim is corrected in place rather than
                  deleted: the escaping is defensive against a single-level
                  wildcard this design does not yet use, and the checks that
                  can actually fail are the property tests in
                  TestSubjectEncoding, verified by removing it.
                  The Kafka/Redpanda transport now ships too
                  (treble/plant/kafka.py), so the spec's two-broker topology
                  (§713 durable log, §625 fanout) is two brokers, and the
                  conformance suite runs three implementations rather than
                  two. It is tested against a real Apache Kafka 3.9.1 broker
                  in KRaft mode — no ZooKeeper, no Docker, started per
                  session by tests/plant/conftest.py. Kafka rather than
                  Redpanda for a stated reason: Redpanda publishes no broker
                  binary for either platform (its releases carry only rpk,
                  the CLI), so running it needs Docker, which this machine
                  does not have. The two speak one wire protocol, so the
                  adapter under test is the same adapter; what is NOT claimed
                  is that Redpanda itself was ever run here. It was not.
                  Kafka 3.9.1 rather than 4.x because 4.x requires Java 17+
                  and the dev machine has 16 — pinned so the suite does not
                  depend on whichever JDK a contributor happens to have, with
                  CI pinning temurin 17 explicitly rather than inheriting the
                  runner's default. What Kafka adds over JetStream, and the
                  reason the spec names it, is keyed partitioning: ticks are
                  keyed by instrument, so one instrument lands on one
                  partition and stays ordered while many consumers read in
                  parallel. Verified by mutation — remove the key and the
                  ordering test fails with [3, 4, 5, 6, 7, 9, ...] against
                  [1..12]. Getting that demonstration honest required a
                  design fix: the first version filtered a per-instrument
                  subscription on the Kafka record key, which is also what
                  picks the partition, so removing the key broke delivery
                  outright and the ordering test failed with an empty list —
                  passing for a reason that had not touched partitioning at
                  all. Filtering now reads the decoded tick's subject, and
                  the key is purely a routing decision. Two smaller checks
                  were strengthened the same way: the partition-count test
                  asserted only that a module constant exceeded one (true of
                  an integer regardless of the topic) and now asks the broker
                  via describe_topics; and create_topics caught Exception,
                  the identical shape as the NATS connect() bug, now
                  TopicAlreadyExistsError only. One real semantic difference
                  is recorded rather than hidden behind a symmetric-looking
                  interface: Kafka has no server-side subject filter, so
                  per-instrument subscription discards bytes that already
                  crossed the wire, and subscribe(None) is the efficient call
                  on this transport where subscribe(one) is not.
                  A provenance defect was found and fixed alongside: six of
                  fifteen adapters stamped a source_system differing from
                  their own meta.source_id, and three separate EDGAR adapters
                  all collapsed to 'edgar', so a value's provenance could not
                  say whether it came from companyfacts, submissions or the
                  bulk file — three extraction paths with three parser
                  versions, and SPTR renders that chain. It also silently
                  broke any join from the ingest log to the facts a source
                  produced, which reads as 'this adapter ingested nothing'.
                  Every adapter now stamps self.meta.source_id, enforced by
                  an AST check over every discovered adapter (a literal is
                  refused) plus a test that no two adapters share an id;
                  verified to fail against the previous code"}
