                  100bp call against 100bp of scatter cannot be read as a
                  signal; treble/tapi/issuer_curves.py builds them from the
                  store. Live: 35 issuer curves on 2026-03-31 and 23
                  significant calls. The comparable set matches on currency,
                  issuer category and maturity proximity and *reports* the
                  three dimensions it could not match on, because a
                  similarity metric that silently dropped two of three would
                  compare a senior secured note with a subordinated one and
                  look confident doing it. Two defects found by the tests
                  rather than by review: a `variance == 0` guard that never
                  fired because identical maturities give ~1e-32, so the fit
                  divided one denormal by another; and a default of 'most
                  recent report date' that returned a single US Treasury bill
                  curve while 35 corporate curves sat a month back — N-PORT
                  coverage of a recent month is thin until its funds file, so
                  the default is now the date with the most fittable issuers,
                  with the per-date coverage carried on the result.
                  The TVAL screen now ships: three tabs on both surfaces
                  from one definition, with a conformance case each. ISSUER
                  CURVES lists all 35 fitted curves with their slope and RMS;
                  RICH/CHEAP ranks 135 calls with significant ones first and
                  the rest marked '(in noise)', because a screen ordered by
                  residual alone puts the noisiest curves at the top; METHOD
                  is the §15 transparency drill-down and is the honest centre
                  of the screen — report date and why that date rather than
                  the most recent, per-date coverage, the price source stated
                  as an implied mark rather than a traded level, the day
                  count and frequency N-PORT does not supply and this model
                  assumes, the dimensions matched, and the three it could not
                  match on named as absent. Every value on that tab is kept
                  short enough to survive the pane's truncation, because a
                  row reading 'absent from' with the rest cut off states the
                  opposite of what it means. Prong 1 is deliberately not a
                  tab: it scores contributed observations and nobody
                  contributes to this install, so a tab permanently reading
                  'no observations' would look like a broken screen rather
                  than an empty network — ALLQ already renders that state
                  correctly. A defect in this criterion's own shipped
                  output was found by going looking for seniority: issuer
                  curves were being fitted over securitisations. The fitter
                  read nport:issuerCat and never fetched nport:assetCat, and
                  issuerCat cannot do that job — a securitisation vehicle IS
                  a corporation, so filers classify it CORP. On the live
                  store 90% of debt holdings read issuerCat=CORP while
                  assetCat put 171 of 460 bonds (37%, across 36 LEIs) in
                  ABS-O, ABS-MBS, ABS-CBDO or STIV. A CLO tranche's spread
                  is about its collateral pool and its place in that deal's
                  waterfall; a master trust's is about its receivables.
                  Neither is a statement about the credit of the entity whose
                  LEI the filing carries, which is what an issuer curve
                  claims to measure, so the fit was a weighted average of two
                  unrelated spread regimes and RICH/CHEAP was reported
                  against it. Filtering to assetCat=DBT takes the fitted set
                  from 35 curves to 27 — eight shipped curves were
                  substantially securitisations. The module had no tests at
                  all, which is how this survived: it sat at 0% coverage
                  while the repository-wide floor passed comfortably, because
                  a floor is an average and an average cannot see one module
                  at zero. It has tests now, verified to fail when the filter
                  is widened to admit ABS. That average is now closed as a
                  class rather than a case: `scripts/check_module_coverage.py`
                  runs after pytest in the gate and fails if any shipped
                  module has no test touching it at all, with anything
                  genuinely unmeasurable named in an allowlist alongside the
                  reason (one entry: the xlwings UDFs, which need Excel).
                  It found a second module the same way — tapi/vol_surface.py
                  was also at 0% and now has tests at 92%. Verified by
                  deleting both test files and watching it name both modules.
                  It is a gate step rather than a test on purpose: the first
                  version was a test, and pytest-cov writes .coverage when
                  the session ends, so it validated the previous run and
                  skipped outright on a clean checkout — a check that could
                  not fail exactly where it mattered. Seniority itself is NOT
                  recoverable from N-PORT, and that is now a measured
                  negative rather than an assumption: 0 of 460 debt titles
                  carry any seniority token, because nport:title is the
                  issuer's name ('American Express Co', 'Bayer US Finance
                  LLC') and not an instrument description. The N-PORT schema
                  has no seniority field at all.
                  The ratings route is now characterised rather than
                  merely 'not established'. SEC Rule 17g-7(b), effective
                  2015-06-15, REQUIRES every NRSRO to publish its credit
                  rating history — every rating outstanding since 2012-06-15
                  plus subsequent upgrades, downgrades and withdrawals — as a
                  public XBRL file under the Record of Credit Ratings
                  Taxonomy. So ratings history is legally mandated to be
                  public, free and machine-readable, which is the opposite of
                  what 'not established' implied.
                  What blocks it is not availability. Rule 17g-7(b) requires
                  each NRSRO to host the file on its OWN website and merely
                  link to it from Exhibit 1 of Form NRSRO; the SEC publishes
                  no central mirror. So the obstacle is per-vendor terms —
                  S&P, Moody's and Fitch each impose their own, and this
                  repository does not automate a source whose terms it has
                  not read and satisfied. Those terms have now been read, and the
                  route is closed rather than untried. All three smaller
                  NRSROs named as the tractable next step were checked
                  2026-08-09. Egan-Jones hosts the file at egan-jones.io,
                  which returns 403 to every non-browser client including
                  robots.txt — the DTCC and Stooq line, and not circumvented.
                  KBRA publishes two XBRL histories (issue-level and
                  issuer-level, both linked from /regulatory) and its Terms
                  of Use say 'You may not use any robot, spider, scraper,
                  crawler, data extraction tool, automated script, bot, or
                  other automated means to access, monitor, copy, or collect
                  information or content from the Service', and separately
                  forbid storing it 'in a database' — which is what this
                  repository is. Morningstar DBRS forbids 'any automated
                  device, program, tool, algorithm, process, or methodology
                  ... to access, acquire, copy, or monitor any portion of the
                  Site'. So the rating dimension is not obtainable at zero
                  cost from any source whose terms could be read, and that is
                  now a measurement rather than an assumption.
                  KBRA is the one worth remembering: its robots.txt is
                  'User-agent: * / Allow: /' — an explicit permission — while
                  its Terms of Use prohibit exactly the access robots.txt
                  appears to grant. A check that consulted robots.txt alone
                  would have returned 'permitted' and been confidently wrong.
                  robots.txt states what a crawler may fetch; it is not the
                  licence, and this repository reads the terms.
                  Outstanding, and why this is not higher: (a)
                  rating and seniority remain absent — seniority now known to
                  be absent from the only free source this repository has,
                  and ratings known to be mandated-public but hosted per-NRSRO
                  behind unread terms — so the similarity metric
                  is incomplete by construction and says so on screen;
                  (b) §15.4's residual layer now ships (treble/analytics/tval/residual.py) and its design is a refusal: the null it must beat is predicting zero residual, measured out of sample over seeded 5-fold cross-validation, and is_useful is False unless it wins by 5%. A boosted tree on two hundred bonds and three features always fits the training set and usually does worse out of sample, so a layer that cannot beat predicting zero is not allowed to move a price. Most of the suite is spent on pure noise, where False is the correct answer; one case with a genuine size effect confirms the refusals are honesty rather than the model never working. Maturity is deliberately excluded from the features because the curve is fitted on it, so a model given it would relearn the curve's shape and report the curve's skill as its own. Mutation-checked, and the third mutation exposed the seventh unfailable check of the session: weakening the null from zero to the training mean left all eleven tests passing, because the noise fixture is centred and the two nulls coincide there. It now tests against residuals biased 30bp wide, where a mean-null subtracts the bias for free and would let a biased curve look unbiased — hiding precisely the defect this layer exists to surface. §15.5's multi-time bid/mid/ask snapshots now ship, and the entry that called them data-blocked was conflating two absences. The intraday captures for corporate bonds are genuinely missing and stay missing; knowing when 4pm New York falls in UTC never depended on them, and the two were collapsed into one excuse — the same move as the product catalogue that read 'HICP stored' on a store holding none. treble/analytics/tval/snapshots.py resolves the four times §15.5 names (Tokyo close, London 16:15, New York 15:00 and 16:00) through the IANA zone database, never a written-down offset, and a TVAL SNAPSHOTS tab renders bid/mid/ask at each. Daylight saving is the whole risk: a series on fixed offsets reconciles against itself perfectly, every day, and is an hour wrong for months. The test that pins it uses 2026-03-10, the fortnight when New York has sprung forward and London has not, so the usual five-hour gap is four — a hard-coded offset is wrong there and nowhere else, which is exactly why it would survive review. Mutation-checked against a plausible fixed-offset table. One-sided books produce no mid, because a 'mid' built from a bid alone is a bid wearing a different label. On this install every time is empty, and the panel says so per row rather than rendering four blank lines that look like four evaluations which agreed. Prong 2's *other* half now ships too. `ComparableSet` — §15.1's similarity metric — was built, tested and called by nothing outside its own suite, and the consequence was measurable: an issuer curve needs three bonds from one entity, 28 of 153 issuers clear that, and **157 of 269 bonds were absent from the rich/cheap ranking entirely**. Not refused on screen; simply not there, which is the quieter and worse failure. A TVAL PEERS tab now values 121 of them, 12 significant and 109 in noise. Two things are published with every call because a peer call is a materially weaker claim than a curve call: the peer group's own dispersion, so a bond 80bp from a median whose peers span 400bp reads as noise exactly as a curve call inside its residual scatter does; and the peer count over the universe size, because on this store a 'peer group' is routinely 226 of 233 bonds — a market level wearing the word peer. With rating, sector and seniority all absent that is what these dimensions can deliver, and the ratio says so rather than leaving a reader to assume selectivity. The missing dimensions travel on every row rather than sitting in a docstring nobody reading the screen will see. Mutation-checked: flipping the residual's sign fails two tests, disabling the noise gate fails one. Finding it also fixed a smaller thing — issuer names were populated only for fitted issuers, so every peer call would have been attributed to an unreadable LEI. Adding the tab also exposed an I6 gap one level below where the check was looking: test_every_shipped_screen_has_a_case is satisfied by a single case on a four-tab screen, so the new tab shipped with nothing checking it. There is now a per-tab check as well; run against the repository it found exactly one uncovered tab — the one just added — so the convention had been right all along and only the enforcement was shallow. Separately, lightgbm was declared in pyproject and could not be imported on this machine (missing libomp.dylib); nothing imported it, so nothing had noticed. Removed 2026-08-09 rather than fixed: a manifest that names a dependency the project cannot load is a false statement about the project, and this layer uses scikit-learn. Raised to 0.95 on 2026-08-09 because both outstanding items are now measured as data-blocked rather than unbuilt — rating and seniority are unobtainable from any free source whose terms permit it, and §15.5's snapshots need intraday quote captures no such source provides. What could be built here has been"}
  P2_5:  {done: 1.0, name: "CDSW against ISDA published test cases",
          basis: "CDSW has no market data source, established 2026-08-07 and recorded so nobody builds a screen that renders empty: the store holds zero credit subjects and no spread facts. The DTCC CFTC tape serves CFTC_CUMULATIVE_RATES_<date>.zip but the analogous CREDIT filename returns 403, and the cumulative listing API returns empty for RATES and 400 for other asset-class tokens, so it cannot discover the real name. That does not touch the criterion, which is validation against ISDA's published cases and is met; it means the pricer is correct and unfed. The criterion is met: validated against ISDA's own
                  published RFR test grids (from cdsmodel.com under the ISDA
                  CDS Standard Model Public Licence v1.0, which permits
                  reproduction and derivative works with attribution
                  retained). Six currencies now, not one — USD/SOFR at trade
                  date 2022-06-22 plus AUD, CHF, EUR, GBP and JPY at
                  2021-04-30 — 2,388 published cases each, 10,344 evaluated
                  per run after striding the five added grids. Hazard
                  calibrated so our par spread equals ISDA's quoted spread
                  and then priced at the trade's own coupon: the ISDA
                  workflow, so this tests conventions rather than a curve
                  fit. Result, full grids: median error 0.0424bp (JPY) to
                  0.3259bp (USD), worst 0.4659bp (JPY) to 6.5125bp (AUD),
                  mildly negative bias of -0.04 to -0.26bp in every currency.
                  Two trade dates is the point of the breadth — one date
                  cannot separate a front-stub error from a curve-level one.
                  Outstanding, and why this is not 1.0: the residual is
                  measured and bounded but NOT attributed. The previous
                  attribution recorded here was wrong and has been retracted.
                  Two causes were tested and refuted: sub-dividing the
                  protection integral 2/4/8/16x moves the worst AUD case from
                  6.5125bp to 6.5127bp (no effect at any resolution), and
                  replacing the uniform schedule with the real IMM roll
                  schedule made every grid worse (AUD median 0.060 to
                  1.087bp). The surviving lead is front-stub handling: the
                  five grids traded 41 days into a coupon period carry the
                  larger maxima and USD on a 2-day stub does not, despite
                  having the highest rates. Recorded in the test as a lead,
                  not a conclusion. The wide worst-case tolerance is fenced
                  by an assertion that the maximum sits at the longest
                  maturity, so it cannot double as a hiding place.
                  Narrowed again 2026-08-06: the residual is highly sensitive
                  to the curve day count, which the tests apply uniformly as
                  ACT/365F across six currencies. On the worst-case shape AUD
                  under ACT/360 falls from 6.512bp to 2.860bp and GBP from
                  3.058bp to 1.552bp. That change is deliberately not made —
                  AONIA and SONIA are ACT/365 by market convention, so a
                  better fit under the wrong day count means ACT/360 is
                  compensating for another error rather than removing one,
                  and chasing the benchmark is how a model comes to reproduce
                  a reference by accident. What it establishes is that the
                  residual is not a fixed modelling limit but something an
                  input assumption moves by a factor of two. A same-day
                  correction to that entry: I wrote that the fixtures had
                  discarded each curve's stated conventions, and
                  re-downloading the workbooks shows the RFR Curve sheet
                  carries Type/Tenor/Rates and nothing else — there were none
                  to discard, they are model documentation rather than file
                  data. What the conversion did drop matters more: the Test
                  Grid publishes a Start Date (T+1, protection start) and a
                  Cash Settlement Date (T+3, where the upfront is valued) per
                  case, and price_cds uses the trade date as the origin for
                  both. A three-day shift on every discount factor and accrual
                  is the right order for the ~0.0133-year annuity gap the
                  coupon scaling implies, and fits the error growing with
                  coupon and maturity while ignoring protection-integral
                  resolution. Measured the next day against a probe first
                  validated to reproduce this model's own error: the lead is
                  wrong. Step-in T+1 takes the AUD median from 0.0613bp to
                  0.1091, step-in T+3 to 0.2046, cash settle T+3 to 0.0643,
                  and the worst case moves under 1% in every case. The same
                  probe refuted the IMM schedule a second time at 49.87bp
                  median, ~800x worse. Five explanations eliminated, none
                  surviving; the residual stays fenced by shape. The probe's
                  first version put the shipped configuration at 33.96bp
                  against a true 0.0614 and produced a whole comparison table
                  off it — so the second refuses to print any toggle until
                  its baseline matches, which is also what caught the USD
                  grid at 0.3185 against 0.3244. Also outstanding: the older
                  IBOR grids are not wired A sixth hypothesis was tested and refuted, and its refutation is what closes this. The premium leg's accrued-on-default is approximated as half a period discounted at the period end — a term that scales with the coupon and grows with maturity, which is the residual's exact shape, and which unlike the protection integral had never been tested. Converged integration of (t - start) against the default density takes AUD from 0.0614 to 0.1062 median and USD from 0.3244 to 0.3347, with the worst case unmoved. Being more exact moves AWAY from ISDA, which means ISDA's own model carries the same approximation — so agreement here is agreement with a reference implementation's documented conventions rather than with the mathematics in the abstract. The market settles against that implementation, so matching it IS the criterion, and a more-correct CDS model that disagreed with ISDA would be worse at the only job this one has. Closed with the residual documented rather than solved. Six hypotheses eliminated and none surviving; the residual is a single shape, bounded by the shipped tolerances and fenced by test_the_worst_case_is_the_known_shape so no new regression can hide inside the room it needs. Reopening this needs a new mechanism, not another pass at the same five."}
  P2_6:  {done: 1.0, name: "SWPM multi-curve CSA-aware discounting",
          basis: "the criterion's named requirement — multi-curve CSA-aware
                  discounting — ships and is validated. A forecast curve is
                  bootstrapped against an exogenous discount curve (never
                  itself), tenor basis curves connect index tenors, a
                  cross-currency-basis CSA discount curve is built off the
                  overnight curve, and the CSA resolves to a named discount
                  curve or refuses. The vanilla swap prices with PV, par
                  rate, annuity, cash flows, amortising notionals, and DV01
                  and bucketed DV01 computed by rebuilding the curves from
                  bumped market quotes. Validation: a trade written to match
                  a curve input reprices to its quote to under 0.01bp
                  through a code path independent of the bootstrap residual,
                  and 6/6 targeted mutations of the pricer are killed.
                  The market data exists and the whole chain is verified on
                  it: the DTCC SDR adapter builds four curves from CFTC Part
                  43 public dissemination — USD-SOFR-OIS and EUR-ESTR-OIS
                  for discounting, EUR-EURIBOR-6M and -3M for forecasting —
                  15 trading days each in the store, 14/14 mutations killed.
                  ESTR discounting against EURIBOR-6M forecasting is a real
                  multi-curve environment on real prints: a trade matching a
                  curve input reprices to its quote at 0.0000bp, and the
                  single-curve telescoping identity is broken by EUR 2.11m
                  on EUR 100m. Outstanding, and why this is not 1.0: (a) the
                  SWPM *screen* is still not built — the engine and its data
                  are done, the presentation is not; (b) spec §12.1 lists a
                  product set this does not yet cover: OIS legs (daily
                  compounding), cross-currency with notional exchange and
                  MtM resets, inflation, swaptions/caps/floors, CMS, asset
                  swaps, cancellable and extendible, total return. Cross-currency swaps now ship (treble/analytics/derivatives/crosscurrency.py), completing §12.1. The previous commit recorded cross-currency as data-blocked on FX forwards; that was true of building a basis curve and false of the pricer, which takes market data as inputs exactly as every other §12.1 module here does. Correcting my own block was the work. Notional exchange is modelled and pinned by value rather than direction — without the returned notional the domestic leg reads 12.5m instead of 125m — because it is what separates this from a single-currency basis swap and where the FX risk actually sits. Spot scales the whole foreign leg, coupons and returned notional alike; converting only the coupons leaves the notional exchange unhedged and fails 5 tests. The basis accrues on the foreign leg's notional by market convention, pinned by value because the same spread on the domestic leg has the right magnitude and the wrong sign in the P&L, which is the error most likely to survive a review since every number still looks reasonable. Resettable (mark-to-market) trades are refused rather than approximated: resetting the foreign notional to spot each period removes most of the FX exposure between resets, so pricing one here would overstate that exposure rather than approach it. Still unsourced and recorded as such — the cross-currency basis itself, which is a data question rather than a modelling one. CMS with the convexity adjustment also ships (treble/analytics/derivatives/cms.py), leaving cross-currency as the last §12.1 product. Hull's approximation, named as an approximation: a second-order expansion of the measure change under a lognormal swap rate, not an identity. Replication across a swaption strip is strictly better and the pieces for it exist here, but the fitted surface's own median node dispersion is 55%, so integrating across it would carry that noise into every CMS number while looking more rigorous — the trade is recorded in the module rather than left to be discovered. The adjustment is material rather than a refinement: tens of basis points at 5y into 30y, and a CMS leg priced at the plain forward is wrong in one direction, always too low. Writing the tests exposed the sixth unfailable check of the session and the most instructive one. Twenty-two behavioural tests — positive always, exactly zero at zero vol or zero time, quadratic in vol, linear in time, growing with tenor — all passed with the annuity's second derivative changed from i(i+1) to i*i. Every one of those properties survives a wrong G'' while the number changes. G' and G'' are now pinned against a central finite difference of G itself, which is a genuinely independent computation rather than a restatement, and 9 tests fail under the same mutation. Zero-coupon inflation swaps also ship (treble/analytics/derivatives/inflation.py). The index lag is a required field rather than a default, because it is the convention that actually goes wrong: a price index is published weeks after the month it measures, so the contract never references the index on its own dates — US CPI trades at a three-month lag, UK RPI at two or eight depending on the contract — and using the unlagged level measures a different period from the one the trade pays on. It travels onto the result so a screen can state which lag its breakeven assumes. The fixed leg compounds, (1+k)^T - 1, which is indistinguishable from k*T at one year and the difference between 143% and 90% at thirty on a 3% rate; these are long-dated instruments and that is exactly where a simple-rate shortcut does its damage. The anchor test prices each swap at its own computed breakeven and requires zero, at 1, 5, 10 and 30 years — which ties the compounded leg to the index ratio rather than checking either against a number derived the same way. Deflation is deliberately not floored: a plain zero-coupon swap embeds no floor (TIPS floor their principal, index-linked gilts do not), and adding one would price a different contract. Mutation-checked: a simple fixed leg fails 4 tests, a simple breakeven 3, an ignored payer/receiver sign 1. Total return swaps also ship (treble/analytics/derivatives/totalreturn.py): mark-to-market between resets, with the price and income components carried apart from each other and both legs shown rather than only the net — a +8% return against 3.7% financing nets to a number that makes a large position held against a large liability look like a small one. Income is a required argument rather than defaulting to zero, and the reason is specific to this repository: ADJ_CLOSE from the Twelve Data adapter is ALREADY a total return, so a TRS marked against that series must pass income=0.0 or count dividends twice, while one marked against a raw price series must not. A default would be wrong half the time without saying so. Financing accrues on the notional rather than the current mark — an unfunded TRS finances what was borrowed, whatever the asset has since done — and the test doubles the price to assert the funding leg does not follow, because accruing on the mark is a plausible error that grows with the position's gain. All three of those (dropping income, financing on the mark, ignoring the payer/receiver sign) were mutation-checked and each fails 1-2 tests. Par-par asset swaps also ship (treble/analytics/derivatives/assetswap.py): spread = (100 - price)/annuity + (coupon - swap rate), with both terms carried separately rather than only their sum. They answer different questions — the first is what the bond's price says against par, the second what its coupon says against the market — and a bond can be cheap on one and dear on the other, so a spread built from either alone would rank two bonds by an accident of how their coupons were struck at issue. dominated_by_price says which is carrying the number. The anchor test is the case that must be exactly zero (par bond, coupon equal to the swap rate) and it pins both terms independently rather than a sum that happens to cancel, so a sign error in one cannot hide inside a plausible total. All three plausible mis-derivations were mutation-checked and each fails 2-3 tests: inverting the price difference, dividing the coupon term by the annuity as well, and forgetting to amortise the price term at all. Stated rather than left to be inferred — this is not a Z-spread or an OAS, and the difference is not small for a bond far from par; they agree near par and diverge with the price difference, which is exactly when somebody is most tempted to read one as the other. It is also the spread rather than the credit, since it contains liquidity, optionality and any richness in the swap curve; TVAL's issuer curves are where those separate. Cancellable and extendible swaps also ship (treble/analytics/derivatives/cancellable.py), on the same principle as caps — the right to cancel a payer at T is the right to enter the offsetting receiver at T, so a cancellable payer IS a vanilla payer less a receiver swaption, exactly rather than approximately, and the tested swaption pricers do the work. Two sign decisions carry the risk and both were mutation-checked. Flipping the minus makes a cancellable worth MORE than the vanilla it is built from, which would look entirely plausible on a screen; three tests catch it. Flipping which side the embedded option is on caught nothing at first: the test asserted only that a cancellable payer and a cancellable receiver embed options of different value, which stays true when the two are simply swapped, and all twelve tests passed under the mutation. It now pins the embedded option against the swaption pricer directly and fails under exactly that change. Scope is stated rather than implied — one exercise date only. A Bermudan cancellable, which is what most callable swaps actually are, needs a lattice or least-squares Monte Carlo across the whole schedule, and the right to choose among many dates is worth strictly more than the right to choose on one; the function refuses a schedule rather than pricing the first date and calling it the answer. Caps and floors also ship (treble/analytics/derivatives/capfloor.py), built on the swaption pricers rather than restating them: a caplet IS a one-period payer swaption, so the annuity is that period's accrual times its discount factor and Black/Bachelier are called unchanged. Two copies of Black drift — one gets an edge-case fix, the other does not — and the symptom is a cap and a swaption disagreeing about the same option. Writing the tests corrected a claim in them: put-call parity was billed as catching a wrong accrual, and it cannot. The annuity multiplies the caplet values and the strike leg alike, so it cancels; hard-coding accrual to a constant left all 27 assertions green, including an irregular schedule written specifically to catch that. The annuity is now pinned directly and the absolute level anchored to the closed-form ATM Bachelier price computed outside the pricer — those four fail under the same mutation. Parity is kept beside them, narrowed to what it does check: a dropped period, a mis-paired one, or an option priced on the wrong side.
                  The SWPM *screen* now ships: three tabs (valuation, curve
                  environment, cash flow schedule) rendering on both
                  surfaces from one definition, with conformance cases per
                  tab. It shows a spot-starting 10Y par swap against the
                  live ESTR/EURIBOR-6M pair — PV, par rate, annuity, DV01,
                  30 cash flows, and the basis per tenor. Counted 0.85
                  rather than 1.0 because the trade is a template rather
                  than a bookable position, and because the §12.1 product
                  set above is genuinely part of what SWPM means.
                  OIS legs with daily compounding now ship, which removes the
                  first product on that list. They had been refused rather
                  than approximated, and the refusal was right: scheduling an
                  overnight index as discrete periods values a different
                  instrument. What makes them supportable without a daily
                  loop is that compounding the curve's own daily forwards
                  telescopes — prod P(t_i)/P(t_i+1) = P(start)/P(end) — so the
                  compounded growth over a period is exactly the ratio of
                  discount factors, and no daily iteration could be more
                  accurate than the curve it would read. What genuinely
                  differed was the schedule, so the trade now states
                  `float_frequency`; an overnight curve with none is still
                  refused, because assuming the market's annual convention
                  would value a quarterly-paying trade as an annual one
                  silently. Validated exactly rather than to a tolerance: a
                  self-discounted compounded leg equals N*(D(start)-D(end))
                  to 0.00000000 on the live ESTR curve, a par OIS swap prices
                  to zero, and paying annually or quarterly gives the same
                  leg value — which a model that got the compounding wrong
                  would not. Cashflows carry `compounded` so a schedule says
                  which convention set the rate rather than leaving it to be
                  inferred from the curve's name. Note for the remaining
                  list: swaptions/caps/floors, CMS and
                  cancellable/extendible need a volatility. That was recorded
                  as needing a surface no free source provides, and it was
                  wrong — the CFTC Part 43 tape already ingested for curves
                  carries option premiums, strikes, first-exercise dates and
                  underlier maturities on real swaption trades: 406 with a
                  full expiry-into-tenor in one day's file, across USD SOFR,
                  EUR, GBP and JPY at standard points (1Y1Y, 1Y10Y, 0Y30Y).
                  treble/analytics/vol/swaption.py prices Black swaptions and
                  solves the vol a transacted premium implies, verified by
                  round-tripping the solver against the pricer to 1e-8 and by
                  exact put-call parity. It refuses rather than returning a
                  number where Black has no answer: a non-positive forward is
                  a Bachelier market rather than a high-vol one, and a premium
                  above the price at 300% vol is a data problem rather than a
                  swaption. Run on the live tape it does NOT yet give a usable
                  surface — 61 EUR swaptions solved, dispersion too wide to
                  interpolate, two receivers on the same strike and forward
                  implying 68.0% and 7.7% and wing strikes implying 137-156%.
                  The dispersion is explained by moneyness and by nothing
                  else tested: within 10% of the money the median is 39.1%,
                  outside it 137.5%. Capped notionals do not account for it
                  (one of six extremes is flagged), nor non-standard terms,
                  nor expiry. A second hypothesis — that this is a normal-vol
                  market read lognormally, which is the EUR convention — was
                  tested by adding Bachelier pricing and implied normal vol,
                  and it fails: normal vol shows the same shape, 120.6bp at
                  the money against 329.3bp outside, a 2.7x step where
                  Black's was 3.5x, with comparable dispersion. Bachelier is
                  kept because it is independently right for EUR and JPY and
                  is defined at or below a zero forward where Black is not.
                  Two explanations eliminated — and then the anomaly
                  itself largely explained, on the third attempt, by a defect
                  in my own measurement: the exploratory script priced
                  2026-07-13 prints against a 2026-07-31 curve, an
                  eighteen-day-stale forward that misplaces every trade's
                  moneyness and inflates the wings most. With print day
                  matched to curve day, node dispersion falls from 84-105% to
                  0-17%, off-moneyness exclusions from 16% to 4%, and p90/p10
                  from 9.53 to 2.64. A contributor rather than the whole
                  story, since 2.64x is still wide — but two commits had
                  recorded the wings as unexplained when the leading
                  explanation was a date mismatch in the measuring script. The surface itself now ships
                  (treble/analytics/vol/surface.py), built from the
                  near-the-money prints only, which does not require the wing
                  question answered. It refuses the three things that would
                  make a grid dishonest: nothing is interpolated, so an
                  unobserved node returns None rather than a neighbour that
                  would look identical on screen; every node carries its
                  observation count and the dispersion of the prints behind
                  it; and trades excluded for moneyness or for matching no
                  grid point are counted on the surface rather than dropped
                  silently. Run on one day of the live EUR tape it gives 8
                  nodes at 14% grid coverage, several with dispersion above
                  100% — prints at one point disagreeing by more than the
                  level. That is not yet a usable market surface, and the
                  object says so through its own fields rather than through a
                  caveat somebody has to remember. What it needs is more
                  days, and it now has them. The DTCC adapter emits
                  swaption prints as facts (treble/ingest/dtcc.py
                  swaption_prints), replaying the fifteen stored payloads
                  with no network to give 7,975 prints across USD (4,797),
                  EUR (2,200), GBP (494) and JPY (484). Built from stored
                  facts on the matched day the EUR surface gives 12 nodes at
                  21% coverage with most nodes under 20% dispersion, against
                  8 nodes at 14% and 84-105% dispersion from the ad-hoc
                  script. build_swap_market now takes a report_date, so
                  every day's prints solve against their own curve: all
                  fifteen EUR days build, 1,462 prints solved, grid coverage
                  79% against 21% from one day. That is where the useful part
                  ended and a second defect of mine began — pooling fifteen
                  days at one node raised median dispersion from under 20% to
                  88%, with nodes at 376%, because volatility moves and the
                  pool averages fifteen surfaces while reporting today's
                  date. That is the curve-mixing failure SWPM refuses, and
                  build_surface had accepted it silently; it now refuses
                  prints from another day unless pool_days is passed
                  deliberately, and records the span on the result.
                  The pool is now decay-weighted, and measuring it
                  corrected the reason for having it. Pooling was framed as
                  trading coverage for agreement; it does not. Coverage is
                  79% at every half-life, because a node exists wherever any
                  print lands and decay down-weights rather than removes.
                  What moves is dispersion against the count of nodes with
                  enough effective weight to trust: 1 day gives 27/44
                  confident at 39% dispersion, 2 days 33/44 at 55%, 5 days
                  37/44 at 84%, a flat pool 38/44 at 95%. The default is two
                  days, chosen from that sweep rather than from feel — five,
                  the first value tried, was barely better than not weighting
                  at all. Nodes carry a Kish effective sample size so twenty
                  prints of which nineteen have decayed read as worth one,
                  and `is_confident` uses that rather than the raw count.
                  VCUB now ships, so the surface is reachable rather than
                  merely implemented: two tabs on both surfaces from one
                  definition with a conformance case each, showing 44 nodes
                  at 79% coverage from 1,462 solved prints over 15 days. The
                  grid carries the raw count, the effective count after decay
                  and the dispersion on every row, so a node held up by stale
                  trades reads as thin rather than as evidence. The METHOD
                  tab states the unit (normal vol in basis points, because
                  130 is plausible in bp and absurd in percent), the solve
                  rate (66% of prints read), that each day is priced on its
                  own curve, and that nothing is interpolated. §12.1's
                  swaption/CMS/cancellable products are still unbuilt — what
                  ships here is the volatility they need, not the products.
                  Basis,
                  cross-currency, asset swaps and total return need curves,
                  FX or a price series, all of which exist — those are
                  unbuilt rather than blocked. The OIS trade is reachable
                  rather than merely implemented: SWPM gained a fourth tab
                  showing a spot-starting 10Y ESTR OIS at its own par rate
                  (2.972143% on the 2026-07-31 curve), with the telescoping
                  identity printed beside the computed leg — float leg PV
                  25,532,397.441 against N x (D(0)-D(T)) of the same, residual
                  2e-08. Putting the identity on screen rather than only in a
                  test is deliberate: a reader who can see the two agree can
                  see the compounding is right instead of trusting it. The
                  caption names what is not modelled — no lookback, lockout
                  or payment delay, which a real SOFR trade sets.
                  Tenor basis swaps are the second product off the §12.1
                  list (treble/analytics/derivatives/basis.py). Each leg is
                  built by the vanilla pricer's own float-leg routine rather
                  than reimplemented, so the same 6M cash flows cannot be
                  worth one thing in a basis swap and another in a vanilla
                  one — a test pins the two agreeing to 1e-12. Both legs
                  discount on the CSA curve: self-discounting each on its own
                  forecast curve makes every leg worth N x (D(0)-D(T)) and
                  collapses the basis, which is the single-curve error the
                  framework exists to prevent, and a test asserts neither leg
                  equals that figure. Which leg carries the spread is the
                  trade's, so swapping the legs flips the sign. Validated on
                  live DTCC curves: swap_market now also builds
                  EUR-EURIBOR-3M when the day carries it (omitted rather than
                  interpolated from the 6M quotes, which would make the basis
                  a property of the interpolator), and the 10Y EURIBOR 3M/6M
                  spread comes out at +10.68bp with PV at par exactly zero.
                  Cross-checked independently against the two curves' input
                  quotes: the spread is 0.97x the quote difference at 2Y, 5Y
                  and 10Y alike, that ratio being the fixed-to-floating
                  annuity ratio. Two defects found while testing: both legs
                  were merged into one cashflow tuple where both read
                  'float', losing which side each row belonged to; and
                  BasisSwapSpec defaulted to a different calendar from
                  SwapSpec, so the same leg priced 0.03 apart on 35.6m in the
                  two. Both fixed and pinned. The basis reaches a screen
                  as well: a fifth SWPM tab shows the 3M/6M term structure
                  across six tenors on the live curves, with the par spread
                  beside the two curves' quote difference and the ratio
                  between them. That ratio is the annuity ratio and should be
                  flat; measured 0.973 to 0.975 from 2Y to 10Y, so a reader
                  can check the engine against the market data on the same
                  row rather than taking the spread on trust. A day with no
                  3M curve says so instead of drawing an empty table"}
  P2_7:  {done: 1.0, name: "Canvas with FDC3 context propagation",
          basis: "the criterion's named semantic ships and is
                  mutation-verified 6/6. Colour-group context propagation
                  (§5.3): a broadcast reaches every component on the
                  sender's channel and no other — not another colour, not an
                  unlinked component, and not the sender itself, per FDC3.
                  Joining a channel syncs immediately, because a component
                  that joined red and kept its previous instrument would
                  look linked and be stale, which on screen is
                  indistinguishable from being in sync. Leaving keeps the
                  last context and stops tracking. FDC3 interop is the
                  standard's own `fdc3.instrument`, so a third-party
                  application can broadcast one; since FDC3 carries no asset
                  class, the assumed yellow key is a named parameter rather
                  than a buried constant. One mutation found a latent bug
                  rather than a weak test: without the unlinked-sender
                  check, two unlinked components form an implicit shared
                  group and overwrite each other. The layout model and
                  per-user persistence ship — placement in grid cells rather than pixels, because
                  a layout saved in pixels only reconstructs on the display
                  it was saved from and §5.3 says layouts follow a user
                  across machines; overlap reported rather than prevented,
                  since §4.2 allows floating windows over one another; and
                  restoring onto fewer displays refused rather than silently
                  reflowed, because reflowing loses an arrangement the user
                  built and is the renderer's offer to make with the user
                  watching. Context is deliberately NOT saved with a layout:
                  reopening a workspace and finding yesterday's instrument
                  on every screen, with nothing saying it is a day old, is
                  the stale-display failure refused everywhere else. The TUI
                  question is answered rather than left open — context
                  propagation is renderer-agnostic so a TUI pane joins a
                  colour group like any other component and I6 holds, while
                  free-form placement is not, so `placement` is optional and
                  a component without one is fully functional. `resolve_canvas`
                  now wires the bus to the renderers: every component
                  resolves through the same `resolve()` the screens use, at
                  one `as_of` for the whole workspace — resolving each
                  against its own clock would let two linked screens show
                  one instrument as of different moments, which reads as a
                  data disagreement rather than a timing artefact. An
                  unknown screen mnemonic raises rather than yielding an
                  empty pane, because a blank rectangle on a canvas is
                  indistinguishable from a component whose instrument has
                  nothing to report. Verified to fail when the context
                  hand-off is broken. `CNVS <GO>` now serves a whole
                  workspace: every component with its buffer, placement and
                  colour group, resolved at one as_of through the same
                  resolver the single-screen path uses. The single-screen
                  `buffer` field stays empty for a canvas, because a client
                  falling back to it would show one screen where a workspace
                  was asked for. Three states that would each render as an
                  empty rectangle are distinguished in the status line — no
                  canvas configured, a configured canvas with no components,
                  and a component that failed to resolve — since an empty
                  workspace and a lost layout look identical otherwise.
                  Disabling the CNVS branch fails 6 of 10 tests.
                  Both clients now draw it, which was the last gap. The
                  shared TypeScript renderer gained `canvasTextSnapshot` and
                  `renderCanvasHtml`, the TUI gained a compositor, and the
                  Tauri shell and the terminal both branch on a canvas
                  response before the single-screen one — checked before
                  `buffer` precisely because drawing one screen where a
                  workspace was asked for is the failure that branch exists
                  to prevent. Frames name their screen and colour group, so
                  a link is visible rather than merely configured, and
                  content that does not fit its placement is marked CLIP
                  rather than silently truncated: a screen missing figures
                  that looks complete is worse than one that says it is cut.
                  Canvas conformance runs the whole workspace across all
                  three renderers — I6 for a layout, not just a screen —
                  from cases assembled out of screen cases already under
                  test, so the only thing it can fail on is compositing.
                  Two cases: a six-component desk, and an overlapping pair
                  that exists because a z-order mutation survived without
                  it. Sort order is unobservable until two components
                  collide, and §4.2 permits exactly that. Mutation-verified:
                  dropping the CLIP marker, dropping unplaced components and
                  reversing z-order are each caught, in the TypeScript and
                  the Python compositors independently. The server's
                  per-component field was renamed `buffer` to `tree` so the
                  wire shape *is* the conformance shape; the two differing
                  by a field name would have left the desktop client drawing
                  nothing while every renderer test stayed green.
                  Outstanding, and why this is not 1.0: layouts are
                  configured rather than authored — layout authoring now ships (treble/render/layout.py): move, resize, save and restore, with the rules in one place so the TUI, the web renderer and the desktop shell cannot disagree about whether a drop was legal, which is the reason screen definitions are shared rather than reimplemented (I6). Mouse handling stays in each renderer; the rules do not. An overlap is refused rather than nudged, because a layout manager that moves a window the user did not drag has decided something for them and the next drag starts from a position they did not choose. Nothing mutates in place, so a refused drag cannot leave a half-modified layout — the state that would otherwise persist to disk and be restored as the workspace. Restoring onto fewer displays keeps the display index and reports the stranded components rather than reflowing them, since silent reflow loses the arrangement permanently: the user reconnects the monitor and the layout does not come back. Mutation-checked, and the second mutation exposed the eighth unfailable check of the session — the atomicity test asserted only that no .partial file was left behind, which is equally true of a plain write_text, so replacing the atomic save with a direct one left everything passing. It now interrupts the rename and asserts the previous layout survives intact, which is the property atomicity actually buys. Layouts are now authored in-app, and the
                  entry that said otherwise was wrong about what the caller
                  had to be. `render/layout.py` sat built, tested and
                  unreachable behind a note reading 'the desktop shell's
                  drag and resize gestures are the caller and are not
                  built'. That assumed a mouse. This workstation's primary
                  input is a command line — §5.2 makes `<GO>` the commit
                  step — and one of its two renderers is a terminal, where
                  there are no gestures to build and never will be. Had the
                  gesture handler been written first it would have lived in
                  the desktop shell, and the TUI would have been the one
                  renderer unable to arrange its own workspace: an I6
                  failure created by the choice of caller, not by the
                  screens. The caller is `CNVS MOVE|SIZE|SAVE|LOAD`,
                  implemented once in treble/render/authoring.py and called
                  by both the Textual app and the HTTP surface. 28 tests.
                  The one that keeps them honest drives the same refusal
                  through both surfaces and asserts the status strings are
                  identical — verified to fail when the TUI is made to
                  ignore the verb, which is what a second implementation
                  would look like on its first day. Canvas gained
                  with_placements() because a move produces new components
                  (placements are frozen) and rebuilding from those alone
                  drops every channel's context and every component's last
                  received instrument. The symptom would be linked panels
                  quietly ceasing to follow the group after a window is
                  moved, which reads as an FDC3 fault rather than a layout
                  one. Mutation-checked in two steps: dropping both
                  restores fails three tests, dropping only the
                  per-component restore fails exactly one — the unlinked
                  component that holds a context nothing in the component
                  list can recover. Refusals return no canvas at all rather
                  than an advisory, so a rejected move cannot be committed
                  by a caller that forgot to check; overlapping moves,
                  sub-minimum resizes, saving a canvas with no placements,
                  and layout names containing a path separator are all
                  refused with the reason. Outstanding: drag and resize
                  gestures remain unbuilt in the desktop shell, but they
                  are now a second way to call these functions rather than
                  the only way, and FDC3 interop is modelled against the
                  standard's context shape without a real desktop agent to
                  federate with"}
  P2_8:  {done: 0.99, name: "gRPC + Arrow Flight transports",
          basis: "Arrow Flight ships: a FlightServerBase serving guarded
                  fact exports as Arrow tables with a fixed schema, reading
                  through the same store handle and the same point-in-time
                  as_of as every other TAPI path. Built on a bulk-export
                  guard that did not previously exist —
                  SourceMeta.redistribution_restricted had been declared on
                  13 adapters since Phase 1 and read by nothing, its own
                  docstring naming a guard that was never built. Now
                  restricted-source facts are withheld and counted (3,164
                  DTCC facts on the live store), licensed identifier
                  namespaces are refused outright per §9.3, and the
                  withholding travels in the table's schema metadata so a
                  warehouse can tell whether its copy is complete. 5/5
                  mutations of the guard killed. gRPC now ships too: five
                  services (refdata, flds, instruments, contrib, tql) over
                  the same LocalTapi the HTTP and Flight transports use, so
                  a client choosing gRPC gets the same answer to the same
                  question. Generated from proto/tapi.proto by `make proto`,
                  which `make check` depends on; the stubs are gitignored
                  and never committed, because a committed stub can silently
                  diverge from the proto beside it. A kill-test asserts the
                  generated services and RPCs match the proto's declarations
                  — verified to fail on a renamed service. as_of is required
                  and must be timezone-aware on the wire (I2), and
                  FIRMNESS_UNSPECIFIED is rejected rather than defaulted.
                  Outstanding, and why this is not 1.0: spec §8.3 also lists
                  mktdata, mktbar, mktvwap, ems and docs, and names streaming
                  subscriptions. The reason recorded here for their absence
                  was that they need venue adapters 'which do not exist' —
                  that stopped being true on 2026-08-06. mktdata, mktbar and
                  mktvwap now ship as a `MktData` service over real Coinbase
                  prints: the plant's current-state image, fixed-boundary
                  bars with the partial interval flagged on the wire, and a
                  volume-weighted price. has_price, has_volume and has_vwap
                  carry what proto3 scalars cannot, so a never-traded
                  instrument is not a price of zero and a bar with unsized
                  ticks withholds its VWAP rather than returning a simple
                  average under the name. A server built with no plant
                  refuses FAILED_PRECONDITION rather than answering empty,
                  because 'this deployment has no tape' and 'this instrument
                  has not printed' are different answers. Aggregation reads a
                  retained TickHistory rather than TPIPE, which drains — a
                  bar query off the machine path would consume the stream out
                  from under its other consumer. Building this exposed a
                  defect that had made the whole gRPC guarantee false: `make
                  check` depends on `proto`, `proto` was not declared .PHONY,
                  and a directory named proto/ exists — so make considered
                  the target up to date and never regenerated the stubs.
                  Since the stubs are gitignored, CI on a clean checkout had
                  no generated code and every gRPC test failed at import. Now
                  fixed, with tests/test_makefile.py asserting every target
                  is phony and that check still depends on proto, verified to
                  fail against the original Makefile. Streaming
                  subscriptions now ship too: MktData.Subscribe is
                  server-streaming, optionally sending the plant's image
                  first because a subscriber that began with the next trade
                  would show nothing until something printed — which on a
                  quiet instrument is indistinguishable from a broken feed.
                  Fan-out is treble/plant/broadcast.py: each subscriber gets
                  its own bounded queue, so publishing never blocks and one
                  stalled client cannot become a market-data outage, and a
                  subscriber that falls behind ends with RESOURCE_EXHAUSTED
                  rather than being served a stream that skipped updates and
                  looks complete. Reading TPIPE instead would have consumed
                  the tape out from under every other consumer. Building it
                  surfaced a defect the suite found by hanging: the streaming
                  RPC checked context.is_active() only when a tick arrived,
                  so a cancelled subscription on a quiet instrument spun
                  forever and leaked a server thread per stream. Liveness is
                  now checked every pass via a bounded next_batch, and a test
                  pins that a quiet feed returns promptly. Subscription.stream
                  was removed in the same change rather than shipped: once
                  next_batch existed it had no production caller, which is
                  the declared-but-unread pattern this repository keeps
                  finding. The `docs` service now ships (treble/tapi/documents.py) and needed no new storage: every fact carries provenance, every provenance record names a payload hash, and the payload store already holds those bytes. Content-addressed, so a document served here is the one the facts were parsed from rather than a re-fetch that may since have been revised — the difference between provenance and a hyperlink, and it matters because EDGAR restates and vendors correct while a link resolves to today's version. Descriptors by default and bytes only on request, since one EDGAR bulk payload runs to hundreds of megabytes. The listing is point-in-time (I2) so a drill-down cannot disagree with the screen it was opened from, and a subject with no facts raises rather than returning an empty list because an unknown subject and a sourceless one render the same. redistribution_restricted travels onto the document and not only the fact: the payload is the most concentrated form of a source's data, so serving facts under a restriction while serving the document freely would make the guard decorative. ingest_history reads the log rather than the facts, because 'this adapter ingested nothing' and 'this adapter ingested a payload that produced no facts' render identically from facts alone and only the second is a parser problem. Mutation-checked: a hard-coded restriction flag fails 1 test, ignoring as_of fails 5, dropping the ordering fails 1. Outstanding: `ems` alone, and it is Phase 3 work rather than a gap here — the spec puts FIX connectivity in Phase 3 (§23.3), and an order path needs an execution venue this system has no connection to and no mandate to reach in Phase 2. Absent rather than stubbed.
                  `docs` reached the wire on 2026-08-09, and the gap was in
                  this entry's own wording. The service shipped as a module
                  and was recorded as shipping, but nothing outside the
                  process could call it: `documents_for` and
                  `document_bytes` were imported by `tapi/local.py` alone,
                  so the drill-down existed only for callers already inside
                  the process. Under I7 — TAPI is the only data path — a
                  service with no transport is a service the clients that
                  matter cannot reach, and 'the module ships' read as 'the
                  service ships'. It now has a `Docs` service in the proto
                  (ListDocuments, GetDocumentBytes) with six tests over a
                  real channel. Two details are on the wire deliberately:
                  `redistribution_restricted` travels on each reference
                  rather than needing a second call, because a client that
                  had to ask would sometimes not ask; and no-payload-store
                  aborts FAILED_PRECONDITION while a missing payload aborts
                  NOT_FOUND, because 'this install holds no payloads' and
                  'this payload is gone' are different facts about the
                  replay chain and only the second is a defect. Mutation-
                  checked: hard-coding the restriction flag and dropping the
                  echoed hash each fail a test"}

# Phases 3-5 track one entry per gate criterion, for the reason Phase 2 does:
# the criteria in CLAUDE.md §8 *are* the deliverables, and inventing a
# work-package plan beside them would put a second set of numbers next to the
# gate's own.
#
# Every entry is 0.0. Adding them does not change the reported figure and is
# not meant to: `weights` already reserves 45 points for these phases and they
# were always unearned, so the percentage has been measured against a complete
# denominator all along. What was missing was the *plan*, not the arithmetic —
# this file said nothing about what these phases contain or what blocks them,
# and that is the gap being closed.
#
# `blocker` classifies what stands in the way, because the kinds need different
# responses and read identically when written as prose:
#   code       — engineering only; nothing external is needed
#   data       — needs a source this install does not have
#   terms      — a source exists and its licence forbids or is unread
#   cost       — cannot be done for nothing, which the project forbids
#   unverified — the assessment itself has not been checked; do not trust it
phase_3:
  P3_1:  {done: 0.55, blocker: code,
          name: "IM on Matrix with verified identity; local Synapse in Docker",
          notes: "Synapse is open source and runs locally, so this needs no paid
                  service. The invariant work is identity: `verified` in Matrix means
                  cross-signed device keys, and a chat showing a name without proving
                  the key behind it is the compliance equivalent of an unsourced
                  price. Docker becomes a new environment dependency nothing else
                  here assumes — an ADR question before a coding one.",
          basis: "the client, the identity chain and an offline homeserver ship. Synapse
                  does not, and could not be verified: Docker is not installed on this
                  machine, so deploy/synapse/compose.yaml is written from published
                  deployment docs and has never been run. It says so in its own first
                  paragraph and in its README. That alone caps this well short of 1.0 --
                  a compose file nobody has executed is not a deployment. The ADR
                  question these notes raised is also still open; the file was written
                  because the instruction was to continue, not because the dependency
                  question was settled. treble/im/matrix.py is the client-server API,
                  hand-written for the reason the FIX session layer is: what costs money
                  is a message the client believes it delivered and did not, and that
                  lives in the sync token and the transaction id. The token advances only
                  *after* the batch has been handed to the caller -- advancing on receipt
                  means a caller that raised while processing resumes past those events,
                  which from the client's view never arrived and which nothing reports as
                  a gap. Every send carries a transaction id a retry reuses, so a resend
                  after an ambiguous timeout is deduplicated rather than posted twice --
                  in a chat VCON turns into a booked trade, not cosmetic.
                  treble/im/simulator.py is an in-memory homeserver CI runs with no
                  network and no container, hostile on demand (reject a token, replay a
                  sync batch), because a client this author wrote driven by a server this
                  author wrote agrees with itself -- which matters more here than for FIX
                  since real Synapse could not be run at all. **These notes were right
                  about identity and the gap is recorded rather than closed.** In Matrix,
                  `verified` means cross-signed device keys; treble/im/identity.py proves
                  something different -- domain control, from a whoami round trip against
                  the homeserver that issued the MXID. That is genuinely stronger than an
                  email From header, which the sender asserts and this the server does,
                  but it is NOT Matrix device verification and does not prove the key
                  behind a name. Cross-signing needs the same olm machinery E2EE does,
                  and neither is built. The three links are kept apart -- localpart proves
                  nothing, domain proves homeserver control, domain-to-entity is a GLEIF
                  name match reported as a *candidate* -- because the strength PEOP prints
                  is the strength of the weakest, and one boolean would publish the
                  strongest. Two defects found by running it rather than reading it: the
                  cross-reference compared the domain label against the whole legal name
                  (KENVUE against KENVUE INC.) so it could never fire, and the strongest
                  level was called ENTITY_MATCHED, a confident label on a coincidence --
                  old.com matches 'Old Dominion Freight Line, Inc.'. It is
                  ENTITY_CANDIDATE now and the screen says unconfirmed. The store holds 4
                  GLEIF legal names, so this is real code against nearly no data. No
                  E2EE, and IM says so on screen: an encryption claim over a plaintext
                  transport is the worst thing this module could be wrong about.
                  Mutation-checked: 14 mutants, all killed; one survived first because a
                  membership event has no msgtype, so the msgtype filter caught it and
                  deleting the *type* filter passed -- the discriminating case is an event
                  of another type carrying text-shaped content, which a peer controls. The
                  gate caught two computed-but-unread fields and both got real readers
                  rather than an allowlist entry. Outstanding, and why this is 0.55:
                  Synapse unrun, no cross-signed device verification, no E2EE, no CLI
                  serving the simulator, and no logged-in session behind IM."}
  P3_2:  {done: 1.0, blocker: code,
          name: "PEOP, TVault WORM archiving with retention tests",
          basis: "TVault ships; PEOP does not. treble/vault/worm.py builds on
                  PayloadStore, so write-once is a property of content addressing
                  rather than a check that could be forgotten: re-archiving identical
                  bytes is a no-op and archiving different bytes under an existing key
                  is impossible by construction.
                  What the store did not have is the retention half, and the refusals
                  are the deliverable. Retention runs from the date the record
                  *concerns*, not the date it was archived — a record archived six
                  years late would otherwise be retained six years too long, and being
                  wrong in the safe direction is still being wrong about a date
                  somebody may have to certify. A legal hold outranks expiry, because
                  the hold exists precisely for when the schedule says destroy and an
                  obligation says keep; a hold expiry could override would be no hold.
                  The two refusals are distinct exception types on purpose: `not yet`
                  and `under hold` call for different actions — wait, or ask counsel —
                  and one type would leave the caller unable to tell which. Hold is
                  checked first because it is the stronger and longer-lived reason.
                  Due records are listed, never destroyed on a timer: the schedule says
                  *may*, not *must*.
                  It is NOT WORM media and says so in the first paragraph of the
                  module. SEC 17a-4(f) contemplates storage physically incapable of
                  alteration; this is a directory and `rm` defeats it. What is enforced
                  is that the application refuses, which is a smaller and honest claim
                  than the phrase usually carries.
                  Mutation-checked: bypassing the hold fails two tests, rounding a leap
                  -day retention back to 28 February instead of forward to 1 March
                  fails one — retention must never end earlier than the term states —
                  and letting a repeat archive replace the original terms fails one,
                  which is destruction by another route. The EMS acceptor archives into it, which is
                  what it is for: books-and-records rules require order records and
                  communications to be retained and a FIX session is both. Raw bytes
                  are archived rather than parsed fields — the record a regulator asks
                  for is what crossed the wire, not this parser's reading of it, and
                  the two can differ precisely when it matters. Both directions are
                  retained. Archiving is opt-in; a transport retaining by default would
                  put every test run under a seven-year schedule. Outstanding, and why
                  this was 0.7: PEOP was not built and there was no screen over the
                  vault. Both ship. PEOP is the spec's directory of verified
                  professionals (19.3), and the word verified is where the work is: on
                  this install nothing verifies anyone, because P3_1's homeserver is
                  not built and no credential issuer is configured, so every profile is
                  SELF_ASSERTED and the identity panel prints that plus the reason no
                  verifier exists. A directory showing 'verified' beside an unchecked
                  claim would be worse than one with no verification at all, because a
                  reader would act on it -- the same line as NOT EVALUABLE in PMS. The
                  MATRIX and CREDENTIAL members are declared though unreachable, so the
                  day P3_1 lands the distinction is visible rather than retroactive.
                  Visibility is enforced at read, not at render: a private field is
                  never returned by the directory, so no renderer can leak it, no bulk
                  export can carry it and no federated peer receives it -- filtering in
                  the renderer would put the guarantee in the last layer instead of the
                  first, which is where leaks of this kind come from. Search matches
                  only visible fields, because a searcher who learns that a term matches
                  somebody has learned a private value without being shown it. Contact
                  details default closed (email NETWORK, phone PRIVATE) since a
                  directory publishing everyone email to an unauthenticated reader is a
                  harvesting target; users may open or close any field, which is what
                  the spec means by controlling their own visibility. The profile shape
                  is closed like the compliance predicate set, so no caller can invent a
                  field with no declared visibility. Erasure is real, and the asymmetry
                  with the fact store is deliberate: I2 makes facts append-only because
                  a market fact history is the point, while a person contact details are
                  not a market fact and an append-only record of them cannot honour an
                  erasure request -- so the directory is its own store, personal data
                  never enters `facts`, and `forget` is verified to remove the bytes
                  from disk rather than leave a tombstone. TVLT displays the archive and
                  repeats what the module refuses to claim: this is a content-addressed
                  directory, NOT WORM media, and `rm` defeats it. What is enforced is
                  that the application refuses. Mutation-checked: 11 mutants, all
                  killed, including returning private fields to the public, matching
                  hidden fields in search, and defaulting verification to verified."}
  P3_3:  {done: 1.0, blocker: code,
          name: "EMS FIX connectivity against a simulator",
          basis: "the session layer and a simulator ship; the order path round-trips.
                  The `unverified` marking is resolved: `simplefix` is MIT, pure
                  Python, needs no build step, and — the reason it was chosen — it
                  computes BodyLength and CheckSum itself. It disagreed with a Logon
                  this author hand-wrote and claimed was a published example; the body
                  length was 68 and not 65, and recomputing by hand confirmed
                  simplefix. A session built on a home-made encoder and tested against
                  that same encoder would have agreed with itself forever.
                  treble/ems/session.py is the session half, which is where the money
                  is lost: an order that is rejected is visible, a message never
                  delivered is not. A sequence gap raises rather than being absorbed,
                  and raises *before* the counter moves so a resend still points at
                  the first missing message. A counterparty sending 5 after 3 is
                  saying 4 exists and you do not have it; if 4 was an execution report
                  you hold a fill you do not know about and every position, P&L and
                  risk figure downstream is wrong while looking normal. Duplicates are
                  accepted without advancing, because FIX permits them during resend
                  and rejecting them would reject a legitimate recovery.
                  treble/ems/simulator.py is an acceptor CI can run with no network,
                  as §7 requires. A simulator this author wrote driven by a client
                  this author wrote is a closed loop, so it is deliberately hostile on
                  demand: it can skip a sequence number or corrupt a checksum, which
                  makes the client's refusals exercised rather than asserted. A
                  simulator that only behaves well tests the happy path twice.
                  Checksums in the tests are computed by hand, byte by byte, not read
                  from the encoder. Mutation-checked: absorbing gaps fails four tests,
                  skipping checksum verification fails one. A defect caught by reading
                  bytes off a fill: a 1,000,000 quantity was being encoded `1e+06` by
                  %g, which is not a FIX quantity — a venue rejects it or reads it as
                  something else. A loopback socket now carries it, which the word
                  *connectivity* in the criterion asks for and a hand-off test cannot
                  prove. Framing is the whole job: TCP has no message boundaries, so a
                  read returns half a message or three, and a receiver assuming one
                  read is one message works perfectly on loopback with small messages
                  and fails the first time a venue sends quickly. FIX is
                  self-delimiting through BodyLength and simplefix buffers on it; the
                  loop drains every complete message before reading again, because
                  yielding only the first leaves the rest buffered until the next read
                  — which never comes if the peer is waiting for a reply, a deadlock
                  that looks like a slow venue. Tested by splitting one message across
                  8-byte reads and by delivering three in a single read. Bound to
                  127.0.0.1: there is no authentication here, and a FIX acceptor
                  reachable from a network is one anybody can send orders to.
                  The order state machine ships with cancel and replace, and its
                  refusals are the deliverable. A cancel arriving after the fill is
                  rejected and never acknowledged: a trader who believes an order was
                  cancelled when it was filled is long or short something they think
                  they are flat, and position, P&L and risk all agree with them. A
                  replace below the already-filled quantity is refused rather than
                  clamped, because a silent clamp leaves the trader believing a
                  smaller position than they hold; the replacement carries the filled
                  quantity forward, since losing it would reset cumulative quantity to
                  zero. A duplicate ClOrdID is rejected, because two orders answering
                  to one name make every later cancel ambiguous. Every rejection
                  carries its reason: one without is a rejection a trader cannot act
                  on, not knowing whether to retry, resend under a new id, or check
                  their position because the order already filled. The simulator can
                  be told to rest orders rather than fill them — filling everything
                  instantly would make every cancel arrive too late and the refusals
                  would all pass for the wrong reason. Mutation-checked: accepting a
                  cancel whatever the state fails four tests, forgetting the filled
                  quantity on replace fails one. Reconnect ships. Sequence numbers are
                  per *session*, not per connection, so a process restarting at 1
                  while the peer expects 47 is not resuming — it is claiming
                  forty-six messages never happened. treble/ems/store.py persists both
                  counters after every message rather than at shutdown, because a
                  crash is exactly the case it exists for and a counter flushed at
                  exit is correct except when it matters. `logged_on` is deliberately
                  not restored: a session resumes its counters, never its
                  authentication, and treating a remembered logon as live would let a
                  business message through before the peer identified itself on this
                  connection.
                  SequenceReset is the one door FIX leaves open for a counterparty to
                  insist on a counter, and the refusal is the same decision as
                  refusing to absorb a gap arriving through it. Backwards is refused
                  outright: the next message would duplicate one already processed,
                  and a fill counted twice is a position nobody holds. Forward is
                  legal, lossy, and *counted* — a session that lost eleven messages to
                  an administrative reset and reported nothing looks identical to one
                  that lost none. GapFill loses nothing and is not counted as loss.
                  Mutation-checked, and the third mutation exposed an unfailable check
                  of the kind this repository has now made twice: the atomicity test
                  asserted only that no .partial file remained, which is equally true
                  of a plain write_text, so replacing the atomic save with a direct
                  one passed all fifteen tests. render/layout.py had already found and
                  fixed exactly this, and the note about it was written by the same
                  author who then repeated it. The test now interrupts the rename and
                  asserts the *previous* counters survive, which is the property
                  atomicity buys. Cleaning up that mutation also failed silently —
                  `git checkout` cannot restore an untracked file — and the mutant was
                  nearly committed; the restore is asserted now. Outstanding, and why
                  this was 0.9: no CLI command started the simulator, no partial
                  fills, and no heartbeat timer driving the session clock. All three
                  ship now. `treble simulator` binds 127.0.0.1 and nothing else,
                  because this session layer has no authentication and an acceptor
                  reachable from a network is one anybody on it can send orders to.
                  Partial fills are the ordinary case on any venue with size and the
                  place a client's position accounting goes wrong quietly, so the
                  refusals are again the deliverable: a part-filled order stays
                  cancellable, because its remainder is still working and a venue that
                  refused would leave the trader unable to stop it; the cancel keeps
                  the filled quantity, because a cancel that zeroed CumQty would report
                  flat while the trader held stock; and over-filling raises rather than
                  clamping, since a silent cap hides exactly the case where the client
                  ends up holding more than it asked for. Average price is
                  quantity-weighted over a running notional, not a mean of prices —
                  100 at 150 and 900 at 100 is 105, and a client told 125 misvalues
                  the position by 20%. The heartbeat is a pure decision over an
                  injected clock: it does not sleep, because the failure it exists to
                  catch cannot be reproduced by waiting. A test that sleeps three
                  seconds proves a heartbeat fires and says nothing about thirty
                  intervals elapsing between two polls, which is when a naive
                  implementation emits thirty heartbeats or none. HeartBtInt of 0
                  disables the clock and is handled here rather than by every caller,
                  because an implementation reading 0 as always-due spins. Three
                  measurements changed the code. Slicing a quantity by repeating
                  quantity/count, or by dumping the remainder on the last slice, does
                  not accumulate back onto the order: across 341 (quantity, count)
                  pairs remainder-on-last is inexact in 189 and wrong by 0.75 of a
                  share at size, while making each slice the gap between successive
                  exact targets is exact in all 341. The completion tolerance had to
                  become relative — ten million shares in eleven fills lands 1.86e-9
                  short, past a fixed 1e-9 floor, at a size traded daily, and such an
                  order would stay PARTIALLY_FILLED for ever and so stay cancellable
                  after being fully executed. The absolute floor carried alongside it
                  was then removed because nothing could make it fire: the residue of
                  n fills is about n·2.2e-16·quantity, which passes quantity·1e-12
                  only past ~4,500 fills. Three tests could not fail and were
                  rewritten: the slice test used pytest.approx, which passes against a
                  broken split; the large-order test used a quantity that *overshoots*,
                  which satisfies the comparison however small the tolerance is; and
                  nothing bounded the tolerance from above, so loosening it a
                  millionfold — enough to call a 1,000,000-share order filled a whole
                  share short — passed every test. Mutation-checked: 20 mutants, all
                  killed, with two equivalent controls confirming the harness is not
                  simply failing everything. One documented claim was wrong and is
                  corrected: the ordering of the disconnect and test-request checks in
                  `due` is *not* load-bearing, since their guards are mutually
                  exclusive; what matters is that the heartbeat is checked last."}
  P3_4:  {done: 1.0, blocker: code,
          name: "PMS compliance DSL: version-controlled, unit-testable rules",
          basis: "the engine ships with six predicates, content-hashed rulesets and a
                  test suite that is mostly one property.
                  **A rule that cannot be evaluated never reports a pass.** That is
                  the design and everything follows from it. An engine that silently
                  skipped a rule it lacked data for would produce a clean report, and
                  a clean report is what a portfolio manager acts on and a compliance
                  officer signs. `No holdings rated below BBB-` evaluated against a
                  store with no ratings is not compliant, it is unchecked, and the two
                  are indistinguishable on a screen printing PASS for both. So
                  NOT_EVALUABLE is a third outcome, it is not a pass, and a report
                  containing one is not clean. This repository has met the same shape
                  three times — an analytic with no data reporting a price, a
                  similarity metric dropping two of three dimensions, a catalogue
                  claiming HICP stored on a store holding none — and here the cost is
                  a mandate breach nobody was told about. MIN_RATING is in the
                  predicate set deliberately and is evaluable nowhere: a mandate that
                  cares about ratings should see NOT EVALUABLE rather than a rule
                  quietly missing from its report.
                  Rules are data, never code. The predicate set is closed for the
                  reason the screen contract's conditional attributes are closed: eval
                  makes every rule a program, and a rule that can do anything cannot
                  be reviewed by the person whose mandate it encodes. It also makes a
                  rule comparable, hashable and diffable, which is what
                  version-controlled has to mean. A ruleset is hashed over its
                  canonical form and a report names that hash, so a report and the
                  rules that produced it cannot drift — without it, `we were compliant
                  in March` is a claim about a file nobody can reproduce.
                  Issuer concentration aggregates across positions: two lines from one
                  issuer are one exposure, and testing positions individually would
                  let a 45/45 pair pass a 50% issuer cap. Weights are measured on
                  market value, since face would let a deep-discount bond breach a
                  limit it is nowhere near. Limits are exclusive — `no more than 50%`
                  permits 50%. Mutation-checked: treating unevaluable as clean fails
                  one test, measuring issuer concentration per position fails two.
                  treble/tapi/mandate.py connects it to the store, and the live run is
                  the argument for the whole design. Of 686 positions: 686 carry no
                  rating, 445 no maturity, 321 no currency, 243 no issuer — the
                  portfolio is not all bonds and a derivative record does not populate
                  the fields a bond rule reads. Four of five rules in a plausible
                  mandate come back NOT EVALUABLE and one genuine breach is found. An
                  engine that skipped what it could not test would have reported one
                  breach and four passes: a near-clean bill of health on a portfolio
                  where most of the mandate was never checked. Holdings are
                  deliberately not filtered to straight debt — a mandate covers
                  everything the fund holds, and narrowing the input until the rules
                  pass answers an easier question than the one the mandate asks. The
                  seam's tests were first written by grepping the function's source for
                  phrases, which asserts that a comment exists rather than that the
                  code behaves, and one then failed for the wrong reason: it read
                  `assetCat` in the source and concluded the function filtered by it
                  when the function merely populates the field the category rule reads.
                  They are behavioural now. Outstanding, and why this was 0.75: rules
                  were constructed in code rather than loaded from a version-controlled
                  file, and no screen showed a report. Both ship. Mandates are YAML in
                  config/mandates/, which is the form the criterion asks for and the
                  form a compliance officer can review, diff in a pull request and
                  point an auditor at; a mandate encoded in Python is reviewable by
                  none of those. The loader refuses rather than skips, and that is the
                  whole module: a rule silently dropped at load time does the same
                  damage as a rule silently skipped at evaluation, one step earlier and
                  harder to notice because the report will not even name what went
                  missing. So an unknown predicate raises and lists what exists, a
                  missing or wrongly-shaped limit raises, duplicate rule names raise
                  because a reader cannot tell which constraint a PASS refers to, and
                  an empty rule list raises because a mandate with no rules reports
                  clean against any portfolio -- the most dangerous document the loader
                  could produce. `limit: true` is refused specifically: bool subclasses
                  int, so it would otherwise load as a 1% cap, breach on nearly every
                  holding, and read as a data problem rather than a typo. The content
                  hash is over the canonical rules and not the file bytes, so
                  reformatting the YAML leaves a report's hash unchanged while
                  changing a limit changes it -- a hash over bytes would make every
                  whitespace edit look like a mandate change and teach readers to
                  ignore the field. The shipped example carries a MIN_RATING rule that
                  is evaluable nowhere, on purpose: a mandate curated until every rule
                  passes tests the curation rather than the portfolio. PMS displays the
                  report, portfolio-wide with no yellow key, and its verdict line reads
                  NOT CLEAN rather than a breach count -- a summary reading BREACHES: 0
                  on a report containing a rule nobody could test would undo this
                  module's entire argument on the one surface a compliance officer
                  reads. Breaches and unevaluable rules sort above passes, because a
                  report ordered by rule number buries the line somebody must act on. A
                  broken mandate file produces no verdict at all rather than a partial
                  one. Against the live store: 685 holdings, 1 genuine breach (6
                  positions above the 5% cap, largest 10.83%) and 4 NOT EVALUABLE.
                  Mutation-checked: 9 mutants, all killed. One survived first and was
                  the familiar shape -- the unclassified-predicate fallthrough cannot
                  fire while every predicate is classified, so it now has a test that
                  unclassifies one to reach it. A real defect surfaced by a test that
                  would not take: MANDATE_DIR was a *default argument*, bound at import,
                  so the mandate directory could never be redirected by any caller. It
                  resolves at call time now."}
  P3_5:  {done: 0.3, blocker: data,
          name: "TCA",
          notes: "Transaction cost analysis needs executions to analyse, and this
                  install has no trade or position store — the same gap that leaves
                  §12.1's total-return swap unfed. It also needs a benchmark price at
                  execution time, which for corporate bonds means the intraday quotes
                  measured absent on 2026-08-09. Blocked twice; the trade store is
                  the half that is buildable.",
          basis: "the trade store ships; TCA itself does not, and 0.3 is the
                  prerequisite rather than the deliverable. treble/ems/executions.py
                  parses execution reports into facts and treble/ems/transport.py
                  records them, so this install now has a book of what it traded
                  where before it had none — ems/store.py persists FIX sequence
                  numbers and tapi/positions.py reads *fund* holdings out of N-PORT,
                  and neither is a record of our own fills. Executions go in `facts`
                  rather than a table of their own, the opposite call from
                  people/directory.py: personal data cannot be append-only and still
                  honour an erasure request, while an execution is a record of
                  something that happened and must never change, which is what I2 is
                  for. Provenance is the archived FIX message, not 'the EMS said so':
                  transport.py already writes every message to the content-addressed
                  vault before deriving anything from it, so payload_hash is a vault
                  key and the bytes behind a fill can be fetched back and re-parsed —
                  the same archive-then-derive ordering SourceAdapter.run enforces,
                  and the reason recording refuses to run without a vault. The
                  dangerous direction is counting a non-fill as a fill: an ack, a
                  cancel and a reject all arrive as 35=8, and a TCA average that
                  included a cancel at price 0 would read as a good execution, so
                  ExecType is checked against the FIX 4.2 and 4.4 trade codes and
                  everything else is refused by name. An unmapped Side is refused
                  rather than guessed, because a short sale booked as a buy is a
                  position error with a plausible explanation. Found while building
                  it: the simulator's execution reports carried no TransactTime (60),
                  which FIX 4.4 requires — and TCA picks its benchmark from the
                  moment of the fill, so without it an execution's time is whenever
                  the reader happened to receive it, which on a replay is a different
                  answer every run. Fixed in the simulator. Mutation-checked: 6
                  mutants, all killed, including accepting an ack as a trade, signing
                  a sell positive, and writing a fill as an open-ended period rather
                  than an instant. Outstanding, and why this is 0.3 and still
                  blocked on `data`: no TCA computation at all — no arrival price, no
                  implementation shortfall, no VWAP. VWAP and arrival need intraday
                  quotes this install does not have and cannot get for corporate
                  bonds (measured absent 2026-08-09); a close-based benchmark is
                  computable from the 885k twelvedata daily closes and is not yet
                  built. No screen, and no order record — an execution knows its
                  ClOrdID but nothing here stores the order it belongs to, so
                  arrival-price shortfall has no arrival to measure from."}

phase_4:
  P4_1:  {done: 0.0, blocker: code,
          name: "DLIB with TPay compiler and AAD greeks",
          notes: "Engineering only, and the largest single item in the ledger. AAD
                  means differentiating the payoff evaluator rather than bumping it,
                  which is a different program from anything built so far — the
                  existing greeks are finite-difference, see bonds.effective_duration
                  and its bump parameter. The @model registry already supplies the I3
                  envelope a compiled payoff would have to carry."}
  P4_2:  {done: 0.0, blocker: data,
          name: "RISK XVA",
          notes: "Curves and a volatility surface both exist. What XVA needs beyond
                  them is counterparty credit — CDS spreads — and that is the wall
                  CDSW already hit: zero credit subjects in the store, DTCC's credit
                  slice 403s, no free spread source found. A CVA computed from an
                  assumed hazard rate would be a number about an assumption."}
  P4_3:  {done: 0.0, blocker: terms,
          name: "Mortgage stack: prepayment model fitted to agency loan-level data, CMO waterfalls"}
  P4_4:  {done: 0.0, blocker: data,
          name: "TIDX",
          notes: "Index construction needs constituents and their weights. No free
                  source for major index membership has been identified, and the
                  vendors who publish it license it as their product. An index built
                  over the N-PORT universe would be constructible and would not be
                  TIDX — it would be an index of what funds happen to hold."}

phase_5:
  P5_1:  {done: 0.0, blocker: cost,
          name: "ASK with mandatory grounding and the numeric-substitution guard",
          notes: "Needs a language model. A hosted API breaks the zero-external-cost
                  constraint, so this means a local model and therefore a machine that
                  can run one — hardware rather than subscription. The guard is the
                  part that is pure engineering and the part that matters: §9 requires
                  every figure in an answer to be substituted from a TAPI read rather
                  than generated, which is a mechanism, not a prompt. Build the guard
                  and its tests first; it is testable against a stub returning fixed
                  text, with no model present at all."}
  P5_2:  {done: 0.0, blocker: code,
          name: "Published evaluation harness with results",
          notes: "Depends on P5_1 existing to evaluate, but the harness is code and
                  the discipline is familiar — this is the conformance suite applied
                  to answers instead of screens. `Published` is the load-bearing word:
                  a harness whose results are not stated is a harness nobody can
                  check."}
  P5_3:  {done: 0.0, blocker: data,
          name: "TI dashboards",
          notes: "Trade-information dashboards need traffic to aggregate. A one-user
                  local install has none, which is the shape of ALLQ's empty book: the
                  honest rendering is a screen that says so. Whether that satisfies the
                  criterion is a question for the phase gate rather than for the code."}
  P5_4:  {done: 0.0, blocker: code,
          name: "Node federation",
          notes: "Engineering, and §22.1's entitlement model is its prerequisite — the
                  local HTTP surface binds to loopback with no authentication precisely
                  because federating it without entitlements would publish a store. The
                  contribution API is the natural first federated service: it already
                  has a wire format and a correct-when-empty screen."}
  P5_5:  {done: 0.0, blocker: code,
          name: "Mobile",
          notes: "The screen contract was built for this — one definition, many
                  renderers — and a third renderer is the test of whether that held.
                  The conformance suite should extend to it unchanged, which would be
                  the strongest available evidence that I6 earned its cost. Panes are
                  where it will hurt: an 80x22 grid does not fit a phone, and §5.3 has
                  layouts follow a user across machines."}
