                  surface — 61 EUR swaptions solved, dispersion too wide to
                  interpolate, two receivers on the same strike and forward
                  implying 68.0% and 7.7% and wing strikes implying 137-156%.
                  The dispersion is explained by moneyness and by nothing
                  else tested: within 10% of the money the median is 39.1%,
