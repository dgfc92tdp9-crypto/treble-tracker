# The completion ledger — the single source of truth for the reported figure.
#
# The percentage was stated by hand and got it wrong twice in one update: the
# phase weight was reverse-engineered from an earlier (also wrong) figure
# instead of read, and partial work packages were credited by impression
# rather than by deliverable. Both are the same mistake — trusting a recalled
# number over the recorded one.
#
# So the number is no longer written by anyone. `scripts/completion.py`
# computes it from this file, and `tests/test_completion.py` fails the gate if
# PROGRESS.md disagrees with the computation. To change the reported figure you
# must change a `done:` value here and give it a `basis:` — a countable
# statement, not a feeling.

# Fixed phase weights (Jack, 2026-07-26). These are the model; do not re-derive
# them from any previously reported percentage.
weights:
  phase_1: 30
  phase_2: 25
  phase_3: 15
  phase_4: 20
  phase_5: 10

active_phase: phase_1

# Phase 1 has 16 work packages, WP0–WP15. `done` is a fraction in [0, 1].
# Every value other than 0 or 1 needs a `basis` stating what was counted.
phase_1:
  WP0:  {done: 1.0, name: "Toolchain + CI"}
  WP1:  {done: 1.0, name: "core — identifiers, provenance, bitemporal facts"}
  WP2:  {done: 1.0, name: "store — payloads, ingest log, DuckDB"}
  WP3:  {done: 1.0, name: "screen definition contract + conformance harness"}
  WP4:  {done: 1.0, name: "analytics foundations — QuantLib, registry, curves"}
  WP5:  {done: 1.0, name: "bonds analytics — yield, spreads, risk, OAS"}
  WP6:  {done: 1.0, name: "ingest adapters",
         basis: "EDGAR companyfacts/submissions, EDGAR bulk XBRL, FRED,
                 Treasury, TRACE-file, OpenFIGI, GLEIF, N-PORT all ship with
                 recorded-fixture tests. Counted complete: the adapter set
                 the phase requires exists, and later sources are additions
                 rather than gaps"}
  WP7:  {done: 1.0, name: "security master + entity graph"}
  WP8:  {done: 0.9, name: "TAPI",
         basis: "field dictionary, in-process and HTTP transports, Python
                 client, and the analytics service path (model-derived fields
                 compute through TAPI) all ship; the tql service is blocked on
                 WP9 and gRPC/Arrow Flight are Phase 2 by spec 8.3"}
  WP9:  {done: 1.0, name: "TQL — grammar, planner, executor",
         basis: "grammar, planner, executor and analytics dispatch ship; the
                 spec 4.2 query runs, overrides reach the models, and SRCH
                 and EQS are screens whose panes are TQL queries. Named
                 universes remain unsupported and say so — they need index
                 membership data no free source provides"}
  WP10: {done: 1.0, name: "command grammar + dispatcher"}
  WP11: {done: 1.0, name: "screens",
         basis: "all 11 screens built (DES, EQS, FA, FLDS, GP, HP, ICVS, MDL,
                 SPTR, SRCH, YAS), each with a conformance case referencing
                 the shipped definition and rendering on both surfaces"}
  WP12: {done: 1.0, name: "renderers — TUI and desktop against one suite"}
  WP13: {done: 1.0, name: "spreadsheet add-in",
         basis: "TDP, TDH, TDS and TQL ship as plain functions over TAPI with
                 an xlwings shell; Excel is installed on the dev machine so
                 the open question about targeting LibreOffice is closed.
                 `treble addin` prints the install steps"}
  WP14: {done: 1.0, name: "local-only mode — treble init",
         basis: "`treble init` takes a clean checkout to a workstation with
                 real figures on it, verified with networking blocked: seven
                 screens render offline from recorded SEC and Treasury
                 payloads run through the real adapters"}
  WP15: {done: 0.7, name: "Phase 1 gate audit",
         basis: "every criterion audited by running it, one gap found and
                 fixed (I7 had no test protecting its own config). Remaining:
                 the clean-checkout run and a green CI on the audited commit,
                 which cannot be claimed until both have actually happened"}
