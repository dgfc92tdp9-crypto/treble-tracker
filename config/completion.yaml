# The completion ledger — the single source of truth for the reported figure.
#
# The percentage was stated by hand and got it wrong twice in one update: the
# phase weight was reverse-engineered from an earlier (also wrong) figure
# instead of read, and partial work packages were credited by impression
# rather than by deliverable. Both are the same mistake — trusting a recalled
# number over the recorded one.
#
# So the number is no longer written by anyone. `scripts/completion.py`
# computes it from this file, and `tests/test_completion.py` fails the gate if
# PROGRESS.md disagrees with the computation. To change the reported figure you
# must change a `done:` value here and give it a `basis:` — a countable
# statement, not a feeling.

# Fixed phase weights (Jack, 2026-07-26). These are the model; do not re-derive
# them from any previously reported percentage.
weights:
  phase_1: 30
  phase_2: 25
  phase_3: 15
  phase_4: 20
  phase_5: 10

active_phase: phase_2

# Phase 1 has 16 work packages, WP0–WP15. `done` is a fraction in [0, 1].
# Every value other than 0 or 1 needs a `basis` stating what was counted.
phase_1:
  WP0:  {done: 1.0, name: "Toolchain + CI"}
  WP1:  {done: 1.0, name: "core — identifiers, provenance, bitemporal facts"}
  WP2:  {done: 1.0, name: "store — payloads, ingest log, DuckDB"}
  WP3:  {done: 1.0, name: "screen definition contract + conformance harness"}
  WP4:  {done: 1.0, name: "analytics foundations — QuantLib, registry, curves"}
  WP5:  {done: 1.0, name: "bonds analytics — yield, spreads, risk, OAS"}
  WP6:  {done: 1.0, name: "ingest adapters",
         basis: "EDGAR companyfacts/submissions, EDGAR bulk XBRL, FRED,
                 Treasury, TRACE-file, OpenFIGI, GLEIF, N-PORT all ship with
                 recorded-fixture tests. Counted complete: the adapter set
                 the phase requires exists, and later sources are additions
                 rather than gaps"}
  WP7:  {done: 1.0, name: "security master + entity graph"}
  WP8:  {done: 1.0, name: "TAPI",
         basis: "field dictionary, in-process and HTTP transports, Python
                 client, the analytics service path, and the tql service
                 (which SRCH, EQS and the spreadsheet =TQL() all consume)
                 ship. gRPC and Arrow Flight belong to the server deployment
                 path and are Phase 2 by spec 8.3, so they are out of Phase 1
                 scope rather than missing from it"}
  WP9:  {done: 1.0, name: "TQL — grammar, planner, executor",
         basis: "grammar, planner, executor and analytics dispatch ship; the
                 spec 4.2 query runs, overrides reach the models, and SRCH
                 and EQS are screens whose panes are TQL queries. Named
                 universes remain unsupported and say so — they need index
                 membership data no free source provides"}
  WP10: {done: 1.0, name: "command grammar + dispatcher"}
  WP11: {done: 1.0, name: "screens",
         basis: "all 11 screens built (DES, EQS, FA, FLDS, GP, HP, ICVS, MDL,
                 SPTR, SRCH, YAS), each with a conformance case referencing
                 the shipped definition and rendering on both surfaces"}
  WP12: {done: 1.0, name: "renderers — TUI and desktop against one suite"}
  WP13: {done: 1.0, name: "spreadsheet add-in",
         basis: "TDP, TDH, TDS and TQL ship as plain functions over TAPI with
                 an xlwings shell; Excel is installed on the dev machine so
                 the open question about targeting LibreOffice is closed.
                 `treble addin` prints the install steps"}
  WP14: {done: 1.0, name: "local-only mode — treble init",
         basis: "`treble init` takes a clean checkout to a workstation with
                 real figures on it, verified with networking blocked: seven
                 screens render offline from recorded SEC and Treasury
                 payloads run through the real adapters"}
  WP15: {done: 1.0, name: "Phase 1 gate audit",
         basis: "every criterion audited by running it; one gap found and
                 fixed (I7 had no test protecting its own config); clean
                 checkout green at 88.38%; CI green on commit 13a87b4"}

# Phase 2 — real-time, portfolio, risk. One entry per CLAUDE.md §8 criterion,
# because the criteria *are* the deliverables here: unlike Phase 1 there is no
# separate work-package plan to track against, and inventing one would put a
# second set of numbers beside the gate's own.
phase_2:
  P2_1:  {done: 0.45, name: "ticker plant — conflated display, unconflated TPIPE",
          basis: "the conflation split, current-state cache, sequence-gap
                  detection and bounded TPIPE buffer ship and are
                  mutation-verified. TGN and TCMP composites now ship too
                  (treble/plant/quotes.py): TCMP over executable quotes
                  only, TGN over every live quote, as separate properties
                  because a composite blending indicative levels into a
                  price labelled executable is the most dangerous number a
                  quote screen can show. Counted here rather than under
                  P2_2, whose 0.95 rests on the ALLQ screen and the
                  contribution API — the composites were listed as
                  outstanding on this criterion and are credited once.
                  Outstanding: venue adapters, security master enrichment,
                  and the Redpanda and NATS transports"}
  P2_2:  {done: 1.0, name: "ALLQ correct-when-empty; contribution API",
          basis: "both halves ship. Correct-when-empty: expired quotes leave
                  the book empty rather than stale, it records when it last
                  held a live quote, a one-way market has no spread, and the
                  ALLQ screen renders the empty case with a contributor count
                  and a last-live stamp so 'nobody is quoting' and 'the screen
                  broke' cannot look the same — with a conformance case for
                  the empty state and one for a quoted state. Contribution
                  API: a validating service plus POST /contribute, which
                  refuses anonymous, one-sided, crossed, non-positive,
                  zero-size and future-dated quotes with the reason in a 400,
                  and echoes the composites so a contributor can see their
                  level reached the network. Quotes carry firmness
                  (indicative/executable, required with no default) and size;
                  TGN and TCMP are separate composites because a composite
                  blending indicative levels into an executable price is the
                  most dangerous number on the screen. Outstanding, and why
                  this is not counted lower: the HTTP server binds 127.0.0.1 only
                  and deliberately so — there is no authentication, and
                  exposing it needs §22.1's entitlement model (passkeys,
                  per-user entitlements, OIDC, audit logging), which no
                  phase before Phase 5 federation requires. So a remote
                  participant cannot contribute, and the reason is the
                  missing entitlement model rather than the transport. The
                  gRPC contribution surface now ships as well (P2_8), so
                  the criterion's two named halves — correct-when-empty and
                  a complete contribution API — are both done over every
                  transport this phase defines. Counted 1.0 on that basis:
                  the remaining limitation is the loopback binding, and that
                  is §22.1, which no phase before Phase 5 federation
                  requires. Out of scope rather than missing.
                  Corrected 2026-08-03: an earlier
                  version of this basis said the service was 'in-process',
                  which was wrong — POST /contribute is a real network
                  endpoint, just not a routable one"}
  P2_3:  {done: 0.6, name: "PORT with TFM3 v1; factor model validation",
          basis: "no longer zero. This was recorded on 2026-08-03 as
                  hard-blocked: the mathematics (§16.3) needs a K x K factor
                  covariance estimated from a return panel, and the store
                  had none — PX_LAST covered 36 FRED index series, 3 FX and
                  2 crypto pairs, and N-PORT implied marks gave three report
                  dates. That measurement was right and the conclusion drawn
                  from it was too wide: it is a block on *per-name* history,
                  and a factor covariance does not need per-name history.
                  Fama and French publish the factor returns themselves.
                  treble/ingest/frenchdata.py now ingests the Kenneth R.
                  French Data Library: FF5 plus momentum, daily since
                  1963-07-01, and the 49 industry portfolios whose own return
                  series make them usable as assets. Terms checked rather
                  than assumed (robots.txt permits /pages/faculty/ken.french/;
                  no terms-of-use statement on the data pages; files stamped
                  Copyright Fama and French, so the source is marked
                  redistribution-restricted and the bulk-export guard
                  withholds it — asserted by a test, not just declared).
                  treble/analytics/risk/factors.py implements §16.3:
                  sigma_p^2 = w'(B Sigma_f B' + D)w, with the factor
                  covariance (optionally exponentially weighted), exposures
                  and specific risk from one time-series regression per asset
                  so B and D cannot describe different fits, and a
                  decomposition into per-factor variance contributions and
                  Euler marginal contributions. Validated three ways, and the
                  distinction is the point: recovery against simulated data
                  with known betas (the only check with a true answer,
                  compared against each coefficient's own standard error);
                  identities that must hold (contributions sum to variance,
                  Euler recovers total risk); and out-of-sample behaviour on
                  the published returns. That last one is the structural
                  check: a sample covariance predicts its fit period's
                  volatility, so prediction error must track the regime
                  change — measured across three decades, predicted/realised
                  was 1.187 / 0.858 / 1.634 against volatility ratios of
                  1.102 / 0.831 / 1.671. Median industry R^2 is 0.72 on six
                  factors. Outstanding, and why this is 0.4 rather than
                  higher: §16.2 specifies 1,500+ factors and this is six,
                  which is a data limit rather than an implementation one;
                  there is still no per-name equity panel, so a portfolio of
                  individual stocks cannot be decomposed — only one
                  expressed over the published portfolios. The PORT screen
                  now ships: three tabs (ex-ante risk, factor decomposition,
                  asset exposures) rendering on both surfaces from one
                  definition, with a conformance case per tab, off 1,341,473
                  ingested facts. It shows the equally weighted 49-industry
                  portfolio at 16.48% annualised volatility — 16.28% factor,
                  2.55% specific, 97.6% of variance from the factors, with
                  the market at 93.75% of it on a portfolio beta of 0.92.
                  Equal weights because they are the one set that is not an
                  opinion; the screen says 'a template, not a holding' rather
                  than inventing a book, as SWPM does with its template
                  trade. Contributions are labelled in bp^2 because
                  volatilities do not add up, and negative contributions are
                  explained on the screen as hedging tilts rather than left
                  to be read as errors. treble/tapi/factor_model.py refuses
                  three ways that would each yield a plausible wrong screen —
                  total returns regressed as excess, a window taken from the
                  wrong end of history, and assets fitted over a shorter
                  window than their neighbours — and each refusal is
                  mutation-verified. Outstanding: the per-name equity panel,
                  which is the open question a registration-gated source
                  would answer, and §16.2's 1,500+ factors"}
  P2_4:  {done: 0.75, name: "TVAL v1 with transparency drill-down",
          basis: "the criterion's two named requirements ship. Score: 1-10
                  from four published components — corroboration, timeliness,
                  firmness, agreement — each exposed rather than rolled into
                  one number, plus the ASC 820 level with a documented and
                  tunable score-to-level mapping. Drill-down: every
                  observation comes back with its kind, recency and size
                  weights and its share of the price, and a test asserts the
                  headline price is reproducible from those rows. The
                  weighting function is a parameter with a content hash
                  stamped into the I3 envelope, because §15.3 requires a user
                  to be able to run the same machinery with their own weights
                  — baked-in weights would make independent price
                  verification impossible by construction. Refuses rather
                  than guesses: no observations, only-stale observations,
                  future-dated observations, and a weighting that values
                  nothing. Outstanding, and why this is 0.5 rather than
                  higher. Prong 2 now ships in part. It was recorded as
                  blocked on sector, rating and seniority — all three are
                  genuinely absent from the store, and the conclusion drawn
                  was again wider than the measurement. §15.1's other half is
                  an issuer curve fitted across an issuer's outstanding debt,
                  which needs issuer, maturity and price. Measured
                  2026-08-06: 328 bonds carry maturity, coupon, LEI and an
                  implied N-PORT mark, and 36 (issuer, report date) groups
                  hold three or more. treble/analytics/tval/relative.py fits
                  a least-squares yield curve per issuer and returns a
                  rich/cheap residual with the curve's own RMS attached, so a
                  100bp call against 100bp of scatter cannot be read as a
                  signal; treble/tapi/issuer_curves.py builds them from the
                  store. Live: 35 issuer curves on 2026-03-31 and 23
                  significant calls. The comparable set matches on currency,
                  issuer category and maturity proximity and *reports* the
                  three dimensions it could not match on, because a
                  similarity metric that silently dropped two of three would
                  compare a senior secured note with a subordinated one and
                  look confident doing it. Two defects found by the tests
                  rather than by review: a `variance == 0` guard that never
                  fired because identical maturities give ~1e-32, so the fit
                  divided one denormal by another; and a default of 'most
                  recent report date' that returned a single US Treasury bill
                  curve while 35 corporate curves sat a month back — N-PORT
                  coverage of a recent month is thin until its funds file, so
                  the default is now the date with the most fittable issuers,
                  with the per-date coverage carried on the result.
                  The TVAL screen now ships: three tabs on both surfaces
                  from one definition, with a conformance case each. ISSUER
                  CURVES lists all 35 fitted curves with their slope and RMS;
                  RICH/CHEAP ranks 135 calls with significant ones first and
                  the rest marked '(in noise)', because a screen ordered by
                  residual alone puts the noisiest curves at the top; METHOD
                  is the §15 transparency drill-down and is the honest centre
                  of the screen — report date and why that date rather than
                  the most recent, per-date coverage, the price source stated
                  as an implied mark rather than a traded level, the day
                  count and frequency N-PORT does not supply and this model
                  assumes, the dimensions matched, and the three it could not
                  match on named as absent. Every value on that tab is kept
                  short enough to survive the pane's truncation, because a
                  row reading 'absent from' with the rest cut off states the
                  opposite of what it means. Prong 1 is deliberately not a
                  tab: it scores contributed observations and nobody
                  contributes to this install, so a tab permanently reading
                  'no observations' would look like a broken screen rather
                  than an empty network — ALLQ already renders that state
                  correctly. Outstanding, and why this is not higher: (a)
                  rating and seniority remain absent, so the similarity
                  metric is incomplete by construction and says so on screen;
                  (b) §15.4's ML residual layer and §15.5's multi-time
                  bid/mid/ask snapshots are untouched"}
  P2_5:  {done: 0.85, name: "CDSW against ISDA published test cases",
          basis: "the criterion is met: validated against ISDA's own
                  published RFR test grids (from cdsmodel.com under the ISDA
                  CDS Standard Model Public Licence v1.0, which permits
                  reproduction and derivative works with attribution
                  retained). Six currencies now, not one — USD/SOFR at trade
                  date 2022-06-22 plus AUD, CHF, EUR, GBP and JPY at
                  2021-04-30 — 2,388 published cases each, 10,344 evaluated
                  per run after striding the five added grids. Hazard
                  calibrated so our par spread equals ISDA's quoted spread
                  and then priced at the trade's own coupon: the ISDA
                  workflow, so this tests conventions rather than a curve
                  fit. Result, full grids: median error 0.0424bp (JPY) to
                  0.3259bp (USD), worst 0.4659bp (JPY) to 6.5125bp (AUD),
                  mildly negative bias of -0.04 to -0.26bp in every currency.
                  Two trade dates is the point of the breadth — one date
                  cannot separate a front-stub error from a curve-level one.
                  Outstanding, and why this is not 1.0: the residual is
                  measured and bounded but NOT attributed. The previous
                  attribution recorded here was wrong and has been retracted.
                  Two causes were tested and refuted: sub-dividing the
                  protection integral 2/4/8/16x moves the worst AUD case from
                  6.5125bp to 6.5127bp (no effect at any resolution), and
                  replacing the uniform schedule with the real IMM roll
                  schedule made every grid worse (AUD median 0.060 to
                  1.087bp). The surviving lead is front-stub handling: the
                  five grids traded 41 days into a coupon period carry the
                  larger maxima and USD on a 2-day stub does not, despite
                  having the highest rates. Recorded in the test as a lead,
                  not a conclusion. The wide worst-case tolerance is fenced
                  by an assertion that the maximum sits at the longest
                  maturity, so it cannot double as a hiding place. Also
                  outstanding: the older IBOR grids are not wired"}
