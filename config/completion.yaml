                  is defined at or below a zero forward where Black is not.
                  Two explanations eliminated — and then the anomaly
                  itself largely explained, on the third attempt, by a defect
                  in my own measurement: the exploratory script priced
                  2026-07-13 prints against a 2026-07-31 curve, an
                  eighteen-day-stale forward that misplaces every trade's
                  moneyness and inflates the wings most. With print day
                  matched to curve day, node dispersion falls from 84-105% to
                  0-17%, off-moneyness exclusions from 16% to 4%, and p90/p10
                  from 9.53 to 2.64. A contributor rather than the whole
                  story, since 2.64x is still wide — but two commits had
                  recorded the wings as unexplained when the leading
                  explanation was a date mismatch in the measuring script. The surface itself now ships
                  (treble/analytics/vol/surface.py), built from the
                  near-the-money prints only, which does not require the wing
                  question answered. It refuses the three things that would
                  make a grid dishonest: nothing is interpolated, so an
                  unobserved node returns None rather than a neighbour that
                  would look identical on screen; every node carries its
                  observation count and the dispersion of the prints behind
                  it; and trades excluded for moneyness or for matching no
                  grid point are counted on the surface rather than dropped
                  silently. Run on one day of the live EUR tape it gives 8
                  nodes at 14% grid coverage, several with dispersion above
                  100% — prints at one point disagreeing by more than the
                  level. That is not yet a usable market surface, and the
                  object says so through its own fields rather than through a
                  caveat somebody has to remember. What it needs is more
                  days, and it now has them. The DTCC adapter emits
                  swaption prints as facts (treble/ingest/dtcc.py
                  swaption_prints), replaying the fifteen stored payloads
                  with no network to give 7,975 prints across USD (4,797),
                  EUR (2,200), GBP (494) and JPY (484). Built from stored
                  facts on the matched day the EUR surface gives 12 nodes at
                  21% coverage with most nodes under 20% dispersion, against
                  8 nodes at 14% and 84-105% dispersion from the ad-hoc
                  script. build_swap_market now takes a report_date, so
                  every day's prints solve against their own curve: all
                  fifteen EUR days build, 1,462 prints solved, grid coverage
                  79% against 21% from one day. That is where the useful part
                  ended and a second defect of mine began — pooling fifteen
                  days at one node raised median dispersion from under 20% to
                  88%, with nodes at 376%, because volatility moves and the
                  pool averages fifteen surfaces while reporting today's
                  date. That is the curve-mixing failure SWPM refuses, and
                  build_surface had accepted it silently; it now refuses
                  prints from another day unless pool_days is passed
                  deliberately, and records the span on the result.
                  Outstanding: coverage and agreement are in tension —
                  one day gives 21% coverage with tight nodes, fifteen give
                  79% with loose ones — and choosing between them is a
                  modelling decision (most likely a decay-weighted pool) not
                  yet made. Basis,
                  cross-currency, asset swaps and total return need curves,
                  FX or a price series, all of which exist — those are
                  unbuilt rather than blocked. The OIS trade is reachable
                  rather than merely implemented: SWPM gained a fourth tab
                  showing a spot-starting 10Y ESTR OIS at its own par rate
                  (2.972143% on the 2026-07-31 curve), with the telescoping
                  identity printed beside the computed leg — float leg PV
                  25,532,397.441 against N x (D(0)-D(T)) of the same, residual
                  2e-08. Putting the identity on screen rather than only in a
                  test is deliberate: a reader who can see the two agree can
                  see the compounding is right instead of trusting it. The
                  caption names what is not modelled — no lookback, lockout
                  or payment delay, which a real SOFR trade sets.
                  Tenor basis swaps are the second product off the §12.1
                  list (treble/analytics/derivatives/basis.py). Each leg is
                  built by the vanilla pricer's own float-leg routine rather
                  than reimplemented, so the same 6M cash flows cannot be
                  worth one thing in a basis swap and another in a vanilla
                  one — a test pins the two agreeing to 1e-12. Both legs
                  discount on the CSA curve: self-discounting each on its own
                  forecast curve makes every leg worth N x (D(0)-D(T)) and
                  collapses the basis, which is the single-curve error the
                  framework exists to prevent, and a test asserts neither leg
                  equals that figure. Which leg carries the spread is the
                  trade's, so swapping the legs flips the sign. Validated on
                  live DTCC curves: swap_market now also builds
                  EUR-EURIBOR-3M when the day carries it (omitted rather than
                  interpolated from the 6M quotes, which would make the basis
                  a property of the interpolator), and the 10Y EURIBOR 3M/6M
                  spread comes out at +10.68bp with PV at par exactly zero.
                  Cross-checked independently against the two curves' input
                  quotes: the spread is 0.97x the quote difference at 2Y, 5Y
                  and 10Y alike, that ratio being the fixed-to-floating
                  annuity ratio. Two defects found while testing: both legs
                  were merged into one cashflow tuple where both read
                  'float', losing which side each row belonged to; and
                  BasisSwapSpec defaulted to a different calendar from
                  SwapSpec, so the same leg priced 0.03 apart on 35.6m in the
                  two. Both fixed and pinned. The basis reaches a screen
                  as well: a fifth SWPM tab shows the 3M/6M term structure
                  across six tenors on the live curves, with the par spread
                  beside the two curves' quote difference and the ratio
                  between them. That ratio is the annuity ratio and should be
                  flat; measured 0.973 to 0.975 from 2Y to 10Y, so a reader
                  can check the engine against the market data on the same
                  row rather than taking the spread on trust. A day with no
                  3M curve says so instead of drawing an empty table"}
  P2_7:  {done: 0.95, name: "Canvas with FDC3 context propagation",
          basis: "the criterion's named semantic ships and is
                  mutation-verified 6/6. Colour-group context propagation
                  (§5.3): a broadcast reaches every component on the
                  sender's channel and no other — not another colour, not an
                  unlinked component, and not the sender itself, per FDC3.
                  Joining a channel syncs immediately, because a component
                  that joined red and kept its previous instrument would
                  look linked and be stale, which on screen is
                  indistinguishable from being in sync. Leaving keeps the
                  last context and stops tracking. FDC3 interop is the
                  standard's own `fdc3.instrument`, so a third-party
                  application can broadcast one; since FDC3 carries no asset
                  class, the assumed yellow key is a named parameter rather
                  than a buried constant. One mutation found a latent bug
                  rather than a weak test: without the unlinked-sender
                  check, two unlinked components form an implicit shared
                  group and overwrite each other. The layout model and
                  per-user persistence ship — placement in grid cells rather than pixels, because
                  a layout saved in pixels only reconstructs on the display
                  it was saved from and §5.3 says layouts follow a user
                  across machines; overlap reported rather than prevented,
                  since §4.2 allows floating windows over one another; and
                  restoring onto fewer displays refused rather than silently
                  reflowed, because reflowing loses an arrangement the user
                  built and is the renderer's offer to make with the user
                  watching. Context is deliberately NOT saved with a layout:
                  reopening a workspace and finding yesterday's instrument
                  on every screen, with nothing saying it is a day old, is
                  the stale-display failure refused everywhere else. The TUI
                  question is answered rather than left open — context
                  propagation is renderer-agnostic so a TUI pane joins a
                  colour group like any other component and I6 holds, while
                  free-form placement is not, so `placement` is optional and
                  a component without one is fully functional. `resolve_canvas`
                  now wires the bus to the renderers: every component
                  resolves through the same `resolve()` the screens use, at
                  one `as_of` for the whole workspace — resolving each
                  against its own clock would let two linked screens show
                  one instrument as of different moments, which reads as a
                  data disagreement rather than a timing artefact. An
                  unknown screen mnemonic raises rather than yielding an
                  empty pane, because a blank rectangle on a canvas is
                  indistinguishable from a component whose instrument has
                  nothing to report. Verified to fail when the context
                  hand-off is broken. `CNVS <GO>` now serves a whole
                  workspace: every component with its buffer, placement and
                  colour group, resolved at one as_of through the same
                  resolver the single-screen path uses. The single-screen
                  `buffer` field stays empty for a canvas, because a client
                  falling back to it would show one screen where a workspace
                  was asked for. Three states that would each render as an
                  empty rectangle are distinguished in the status line — no
                  canvas configured, a configured canvas with no components,
                  and a component that failed to resolve — since an empty
                  workspace and a lost layout look identical otherwise.
                  Disabling the CNVS branch fails 6 of 10 tests.
                  Both clients now draw it, which was the last gap. The
                  shared TypeScript renderer gained `canvasTextSnapshot` and
                  `renderCanvasHtml`, the TUI gained a compositor, and the
                  Tauri shell and the terminal both branch on a canvas
                  response before the single-screen one — checked before
                  `buffer` precisely because drawing one screen where a
                  workspace was asked for is the failure that branch exists
                  to prevent. Frames name their screen and colour group, so
                  a link is visible rather than merely configured, and
                  content that does not fit its placement is marked CLIP
                  rather than silently truncated: a screen missing figures
                  that looks complete is worse than one that says it is cut.
                  Canvas conformance runs the whole workspace across all
                  three renderers — I6 for a layout, not just a screen —
                  from cases assembled out of screen cases already under
                  test, so the only thing it can fail on is compositing.
                  Two cases: a six-component desk, and an overlapping pair
                  that exists because a z-order mutation survived without
                  it. Sort order is unobservable until two components
                  collide, and §4.2 permits exactly that. Mutation-verified:
                  dropping the CLIP marker, dropping unplaced components and
                  reversing z-order are each caught, in the TypeScript and
                  the Python compositors independently. The server's
                  per-component field was renamed `buffer` to `tree` so the
                  wire shape *is* the conformance shape; the two differing
                  by a field name would have left the desktop client drawing
                  nothing while every renderer test stayed green.
                  Outstanding, and why this is not 1.0: layouts are
                  configured rather than authored — no in-app drag, resize
                  or save — and FDC3 interop is modelled against the
                  standard's context shape without a real desktop agent to
                  federate with"}
  P2_8:  {done: 0.95, name: "gRPC + Arrow Flight transports",
          basis: "Arrow Flight ships: a FlightServerBase serving guarded
                  fact exports as Arrow tables with a fixed schema, reading
                  through the same store handle and the same point-in-time
                  as_of as every other TAPI path. Built on a bulk-export
                  guard that did not previously exist —
                  SourceMeta.redistribution_restricted had been declared on
                  13 adapters since Phase 1 and read by nothing, its own
                  docstring naming a guard that was never built. Now
                  restricted-source facts are withheld and counted (3,164
                  DTCC facts on the live store), licensed identifier
                  namespaces are refused outright per §9.3, and the
                  withholding travels in the table's schema metadata so a
                  warehouse can tell whether its copy is complete. 5/5
                  mutations of the guard killed. gRPC now ships too: five
                  services (refdata, flds, instruments, contrib, tql) over
                  the same LocalTapi the HTTP and Flight transports use, so
                  a client choosing gRPC gets the same answer to the same
                  question. Generated from proto/tapi.proto by `make proto`,
                  which `make check` depends on; the stubs are gitignored
                  and never committed, because a committed stub can silently
                  diverge from the proto beside it. A kill-test asserts the
                  generated services and RPCs match the proto's declarations
                  — verified to fail on a renamed service. as_of is required
                  and must be timezone-aware on the wire (I2), and
                  FIRMNESS_UNSPECIFIED is rejected rather than defaulted.
                  Outstanding, and why this is not 1.0: spec §8.3 also lists
                  mktdata, mktbar, mktvwap, ems and docs, and names streaming
                  subscriptions. The reason recorded here for their absence
                  was that they need venue adapters 'which do not exist' —
                  that stopped being true on 2026-08-06. mktdata, mktbar and
                  mktvwap now ship as a `MktData` service over real Coinbase
                  prints: the plant's current-state image, fixed-boundary
                  bars with the partial interval flagged on the wire, and a
                  volume-weighted price. has_price, has_volume and has_vwap
                  carry what proto3 scalars cannot, so a never-traded
                  instrument is not a price of zero and a bar with unsized
                  ticks withholds its VWAP rather than returning a simple
                  average under the name. A server built with no plant
                  refuses FAILED_PRECONDITION rather than answering empty,
                  because 'this deployment has no tape' and 'this instrument
                  has not printed' are different answers. Aggregation reads a
                  retained TickHistory rather than TPIPE, which drains — a
                  bar query off the machine path would consume the stream out
                  from under its other consumer. Building this exposed a
                  defect that had made the whole gRPC guarantee false: `make
                  check` depends on `proto`, `proto` was not declared .PHONY,
                  and a directory named proto/ exists — so make considered
                  the target up to date and never regenerated the stubs.
                  Since the stubs are gitignored, CI on a clean checkout had
                  no generated code and every gRPC test failed at import. Now
                  fixed, with tests/test_makefile.py asserting every target
                  is phony and that check still depends on proto, verified to
                  fail against the original Makefile. Streaming
                  subscriptions now ship too: MktData.Subscribe is
                  server-streaming, optionally sending the plant's image
                  first because a subscriber that began with the next trade
                  would show nothing until something printed — which on a
                  quiet instrument is indistinguishable from a broken feed.
                  Fan-out is treble/plant/broadcast.py: each subscriber gets
                  its own bounded queue, so publishing never blocks and one
                  stalled client cannot become a market-data outage, and a
                  subscriber that falls behind ends with RESOURCE_EXHAUSTED
                  rather than being served a stream that skipped updates and
                  looks complete. Reading TPIPE instead would have consumed
                  the tape out from under every other consumer. Building it
                  surfaced a defect the suite found by hanging: the streaming
                  RPC checked context.is_active() only when a tick arrived,
                  so a cancelled subscription on a quiet instrument spun
                  forever and leaked a server thread per stream. Liveness is
                  now checked every pass via a bounded next_batch, and a test
                  pins that a quiet feed returns promptly. Subscription.stream
                  was removed in the same change rather than shipped: once
                  next_batch existed it had no production caller, which is
                  the declared-but-unread pattern this repository keeps
                  finding. Outstanding: `ems` needs an order path this system
                  does not have, and `docs` needs a document store. Both
                  remain absent rather than stubbed"}
