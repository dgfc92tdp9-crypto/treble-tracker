# Enforces CLAUDE.md §2 tooling on every commit. CI runs the same checks via `make check`.
repos:
  - repo: local
    hooks:
      - id: ruff-check
        name: ruff check
        entry: uv run ruff check --fix
        language: system
        types: [python]
      - id: ruff-format
        name: ruff format
        entry: uv run ruff format
        language: system
        types: [python]
      - id: mypy
        name: mypy --strict
        entry: uv run mypy treble
        language: system
        pass_filenames: false
        types: [python]
      - id: tests
        name: test suite + coverage floor
        entry: .venv/bin/pytest -q
        language: system
        pass_filenames: false
        types: [python]
      - id: import-linter
        name: import-linter (I7)
        entry: uv run lint-imports
        language: system
        pass_filenames: false
        types: [python]
