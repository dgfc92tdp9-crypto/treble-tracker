[project]
name = "treble-tracker"
version = "0.1.0"
description = "A free and open institutional finance workstation"
requires-python = ">=3.12"

# Stack is fixed by CLAUDE.md section 2. Do not substitute without asking.
dependencies = [
  # core
  "duckdb>=1.1",
  "polars>=1.0",
  "pyarrow>=17",
  "pydantic>=2.8",
  "pydantic-settings>=2.4",
  # analytics
  "QuantLib>=1.35",          # NB: package is `QuantLib`, not `QuantLib-Python`
  "numpy>=2.0",
  "scipy>=1.14",
  "statsmodels>=0.14",
  "arch>=7.0",
  "linearmodels>=6.0",
  "scikit-learn>=1.5",
  "lightgbm>=4.5",
  "cvxpy>=1.5",
  "clarabel>=0.9",
  "osqp>=0.6",
  "highspy>=1.7",
  # grammar / parsing
  "lark>=1.2",
  # ingest
  "httpx>=0.27",
  "tenacity>=9.0",
  "lxml>=5.3",
  # clients / api
  "textual>=0.80",
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "websockets>=13.0",
  "xlwings>=0.32",
  # cli
  "typer>=0.12",
  "rich>=13.8",
]

[project.optional-dependencies]
dev = [
  "ruff>=0.6",
  "mypy>=1.11",
  "pytest>=8.3",
  "pytest-cov>=5.0",
  "pytest-asyncio>=0.24",
  "hypothesis>=6.112",
  "import-linter>=2.1",
  "pre-commit>=3.8",
  "syrupy>=4.7",
]

[project.scripts]
treble = "treble.cmd.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["treble"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "A", "C4", "DTZ", "T20", "SIM", "PTH", "RUF"]
# DTZ is deliberate: naive datetimes are a correctness hazard for I2 bitemporality.

[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
disallow_any_explicit = false
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["QuantLib.*", "xlwings.*", "lightgbm.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
markers = [
  "golden: validates an analytic against published reference values",
  "conformance: renderer conformance case",
  "property: Hypothesis property test of a stated invariant",
  "replay: deterministic replay test (I5)",
]
