[project]
name = "treble-tracker"
version = "0.1.0"
description = "A free and open institutional finance workstation"
requires-python = ">=3.12"

# Stack is fixed by CLAUDE.md section 2. Do not substitute without asking.
dependencies = [
  # core
  "duckdb>=1.1",
  "pytz>=2024.1",  # duckdb needs it to return TIMESTAMPTZ values to Python
  "polars>=1.0",
  "pyarrow>=17",
  "pydantic>=2.8",
  "pydantic-settings>=2.4",
  # analytics
  "QuantLib>=1.35",          # NB: package is `QuantLib`, not `QuantLib-Python`
  "numpy>=2.0",
  "scipy>=1.14",
  "statsmodels>=0.14",
  "arch>=7.0",
  "linearmodels>=6.0",
  "scikit-learn>=1.5",
  "lightgbm>=4.5",
  "cvxpy>=1.5",
  "clarabel>=0.9",
  "osqp>=0.6",
  "highspy>=1.7",
  # grammar / parsing
  "lark>=1.2",
  "pyyaml>=6.0",
  # ingest
  "httpx>=0.27",
  "tenacity>=9.0",
  "lxml>=5.3",
  "defusedxml>=0.7",  # XML from the network must not be parsed by stock ElementTree
  # clients / api
  "textual>=0.80",
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "websockets>=13.0",
  "xlwings>=0.32",
  # cli
  "typer>=0.12",
  "rich>=13.8",
]

[project.optional-dependencies]
dev = [
  "ruff==0.16.0",  # pinned: formatter verdicts must be reproducible across machines
  "mypy==2.3.0",
  "pytest==9.1.1",
  "pytest-cov>=5.0",
  "pytest-asyncio>=0.24",
  "hypothesis>=6.112",
  "import-linter>=2.1",
  "mutmut>=3.0",
  "pip-audit>=2.7",
  "pre-commit>=3.8",
  "syrupy>=4.7",
  "types-PyYAML>=6.0",
  "types-defusedxml>=0.7",
]

[project.scripts]
treble = "treble.cmd.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["treble"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "A", "C4", "DTZ", "T20", "SIM", "PTH", "RUF", "S"]
# DTZ is deliberate: naive datetimes are a correctness hazard for I2 bitemporality.
# S (bandit) is deliberate: security lint fails the build, not a review (spec §22.4).
# N813: `import QuantLib as ql` is the universal QuantLib convention.
ignore = ["N813"]

[tool.ruff.lint.per-file-ignores]
# S101: pytest asserts are the point of test files.
"tests/**/*.py" = ["S101"]
"conftest.py" = ["S101"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
disallow_any_explicit = false
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["QuantLib.*", "xlwings.*", "lightgbm.*", "scipy.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers --cov=treble --cov-report=term-missing:skip-covered --cov-fail-under=84 -m 'not drift'"
markers = [
  "golden: validates an analytic against published reference values",
  "conformance: renderer conformance case",
  "property: Hypothesis property test of a stated invariant",
  "replay: deterministic replay test (I5)",
  "drift: live source schema check; needs network and TREBLE_CHECK_DRIFT=1",
]

[tool.mutmut]
# NOT WORKING as of 2026-07-27 — see PROGRESS.md "Continuous verification".
# mutmut 3.x collides with five of this project's own mechanisms (reflection
# -based invariant tests x3, the coverage floor, and Hypothesis's executor
# health check). Scope is narrowed to the pure numerical modules, where a
# surviving mutant would mean a wrong *number* and where no reflection is
# involved — that is the version worth retrying with a different tool.
paths_to_mutate = ["treble/analytics/curves/hagan_west.py"]
tests_dir = ["tests/analytics/curves/"]
