# CI = exactly `make check` (ADR-0004). Local green and CI green mean the same thing.
# No network access in tests: every ingest test runs on recorded fixtures (CLAUDE.md §7).
name: ci

on:
  push:
  pull_request:

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        # macos-14 is Apple Silicon, matching the development machine (CLAUDE.md §2).
        os: [macos-14, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          uv venv --python 3.12
          uv pip install -e ".[dev]"
      - name: Check
        run: make check
      - name: Dependency audit (spec §22.4)
        run: make audit
