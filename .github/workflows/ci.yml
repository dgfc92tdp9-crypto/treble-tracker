# CI = exactly `make check` (ADR-0004). Local green and CI green mean the same thing.
# No network access in tests: every ingest test runs on recorded fixtures (CLAUDE.md §7).
name: ci

on:
  push:
  pull_request:

jobs:
  check:
    # Ubuntu only: private-repo macOS runners bill at 10x minutes (cost
    # directive, 2026-07-26). The dev Mac covers the macOS leg via make check.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      # The shared TypeScript renderer is a renderer under conformance, so
      # the suite compiles and runs it. Without node, `make check` fails
      # loudly rather than skipping a renderer — which is the point.
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install
        run: |
          uv python install 3.12
          uv venv --python 3.12
          uv pip install -e ".[dev]"
      # The Kafka broker is a JVM process. Pinned rather than inherited:
      # ubuntu-latest's default JDK is not a promise, and an unstated
      # environment assumption is how `make proto` stayed broken on every
      # clean checkout.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      # ~120MB of broker binaries, pinned by version, so the cache key is
      # exact and a version bump misses rather than serving a stale broker.
      - name: Cache brokers
        uses: actions/cache@v4
        with:
          path: .tools
          key: brokers-${{ runner.os }}-nats2.14.4-kafka3.9.1
      # The transport tests refuse to skip when a broker is absent
      # (tests/plant/conftest.py), so CI must have them or `make check` fails
      # loudly. That is the intended behaviour: a transport suite that
      # silently degrades to an in-process fake has verified nothing.
      - name: Broker binaries
        run: make tools
      - name: Check
        run: make check
      - name: Dependency audit (spec §22.4)
        run: make audit
