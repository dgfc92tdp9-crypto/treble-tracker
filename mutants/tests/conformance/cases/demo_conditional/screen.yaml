# Synthetic case: conditional attrs (negative -> red), stale propagation,
# model-derived dotted underline, an editable input, null rendering.
mnemonic: DEMO2
title: Demo Conditional
rows: 6
cols: 44
namespaces: [Corp]
tabs:
  - name: main
    cells:
      - kind: static
        at: {row: 0, col: 0}
        text: "CHG TODAY"
      - kind: bound
        at: {row: 0, col: 12}
        field: CHG_NET_1D
        format: "{:+.2f}"
        width: 10
        conditional:
          - when: negative
            attrs: [negative]
          - when: positive
            attrs: [positive]
      - kind: static
        at: {row: 1, col: 0}
        text: "OAS (mid)"
      - kind: bound
        at: {row: 1, col: 12}
        field: OAS_SPREAD_MID
        format: "{:.1f}"
        width: 10
        conditional:
          - when: is_model_derived
            attrs: [model_derived]
          - when: is_stale
            attrs: [stale]
      - kind: static
        at: {row: 2, col: 0}
        text: "Missing"
      - kind: bound
        at: {row: 2, col: 12}
        field: NO_SOURCE_FIELD
        width: 10
        conditional:
          - when: is_null
            attrs: [stale]
      - kind: static
        at: {row: 4, col: 0}
        text: "Settle"
      - kind: input
        at: {row: 4, col: 12}
        name: settle_dt
        input_type: date
        width: 10
        default: "07/29/26"
