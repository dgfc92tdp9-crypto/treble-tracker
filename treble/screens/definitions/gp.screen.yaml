# GP — Price Graph (spec §7.3).
#
# End-of-day only at Phase 1: there is no ticker plant until Phase 2, so
# nothing here updates intraday. The blink and stale semantics exist in the
# contract and are exercised by delayed data rather than pretended at.
#
# **Index and Equity.** This was Index-only, and the header said why: the
# free equity-price options either required defeating a bot gate or breached
# a ToS, so per-equity GP waited for a licensed feed rather than shipping
# data we should not have taken. That feed now exists — Twelve Data, keyed,
# personal-use licensed, and marked `redistribution_restricted` so the bulk
# export guard keeps it off the contribution API and any federated node.
#
# **The two namespaces do not plot the same quantity, and the screen says
# so.** FRED publishes index levels unadjusted. Twelve Data's daily close is
# split *and dividend* adjusted, so an equity line here is a total return.
# That difference is invisible in the line itself and changes what the line
# means, which is why the basis panel sits above the chart rather than in a
# footnote — see `treble/tapi/prices.py`.
mnemonic: GP
title: Price Graph
rows: 22
cols: 80
namespaces: [Index, Equity]

tabs:
  - name: main
    cells:
      - kind: static
        at: {row: 0, col: 0}
        text: "PRICE GRAPH"
        attrs: [label, emphasis]
      - kind: static
        at: {row: 1, col: 0}
        text: "────────────────────────────────────────────────────────────────────────────"
        attrs: [label]

      - kind: pane
        region: {row: 2, col: 0, height: 4, width: 72}
        pane_type: table_scroll
        binding: "sys:price_basis"
        order: asc

      - kind: static
        at: {row: 6, col: 0}
        text: "CLOSING LEVEL"
        attrs: [label, emphasis]

      - kind: pane
        region: {row: 7, col: 0, height: 12, width: 80}
        pane_type: timeseries
        binding: "sys:price_series"
        order: asc

      - kind: link
        at: {row: 19, col: 0}
        text: "HP  Historical price table"
        command: "{security} HP"

      - kind: static
        at: {row: 20, col: 0}
        text: "End of day only; no intraday feed until Phase 2."
        attrs: [label]
      - kind: static
        at: {row: 21, col: 0}
        text: "Index levels from FRED. Equity closes from Twelve Data, adjusted — see Basis."
        attrs: [label]
